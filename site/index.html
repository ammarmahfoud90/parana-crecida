<!doctype html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crecida del Paraná</title>
<meta name="description" content="El río Paraná hoy, de Puerto Iguazú a San Fernando. No es un sistema de alerta.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div class="langs" role="group" data-t-aria="langGroup">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <nav class="views" data-t-aria="viewsNav">
    <a href="index.html" aria-current="page" data-t="viewToday"></a>
    <a href="wave.html" data-t="viewWave"></a>
    <a href="drivers.html" data-t="viewDrivers"></a>
    <a href="flood.html" data-t="viewFlood"></a>
    <a href="map.html" data-t="viewMap"></a>
  </nav>

  <p class="notice">
    <strong data-t="noticeStrong"></strong>
    <span data-t="noticeBody"></span>
    <a id="official" href="https://alerta.ina.gob.ar/" target="_blank" rel="noopener" data-t="officialLink"></a>
  </p>

  <div id="error" class="err" hidden></div>

  <div class="meta" id="meta" hidden>
    <span><span data-t="dataTo"></span> <b id="lastDay"></b> <span id="fresh"></span></span>
    <span><span data-t="thresholdsFrom"></span> <b id="thrDate"></b></span>
    <span><span data-t="generatedAt"></span> <b id="genAt"></b></span>
  </div>

  <div class="tally" id="tally" hidden>
    <div class="evac"><span class="n" id="nEvac">–</span><span class="k" data-t="tallyEvac"></span></div>
    <div class="alert"><span class="n" id="nAlert">–</span><span class="k" data-t="tallyAlert"></span></div>
    <div><span class="n" id="nRising">–</span><span class="k" data-t="tallyRising"></span></div>
    <div><span class="n" id="nOfficial">–</span><span class="k" data-t="tallyOfficial"></span></div>
  </div>

  <h2 class="section" data-t="listHeading"></h2>
  <ul class="gauges" id="list"></ul>

  <footer>
    <p data-t="method"></p>
    <p data-t="credits"></p>
  </footer>
</div>

<script>
"use strict";

// Every string the page shows. Nothing is translated in the pipeline: the
// exported JSON carries proper nouns and stable keys only, so adding a
// language is a change here and nowhere else.
const T = {
  es: {
    htmlLang: "es",
    locale: "es-AR",
    title: "Crecida del Paraná",
    subtitle: "El río hoy, de Puerto Iguazú a San Fernando",
    langGroup: "Idioma",
    noticeStrong: "Esto no es un sistema de alerta.",
    noticeBody: "Los niveles de alerta y evacuación, los avisos y los pronósticos oficiales los publica el Instituto Nacional del Agua.",
    officialLink: "Ver el alerta oficial del INA →",
    dataTo: "Datos hasta el",
    thresholdsFrom: "Niveles oficiales del",
    generatedAt: "Generado",
    tallyEvac: "superan evacuación",
    tallyAlert: "superan alerta",
    tallyRising: "en aumento",
    tallyOfficial: "con niveles oficiales",
    listHeading: "Estaciones, aguas arriba hacia aguas abajo",
    viewsNav: "Vistas",
    viewToday: "El río hoy",
    viewWave: "La onda",
    viewDrivers: "Aguas arriba",
    viewFlood: "Superficie",
    viewMap: "Mapa",
    statusBelow: "Bajo el nivel de alerta",
    statusAlert: "Supera el nivel de alerta",
    statusEvacuation: "Supera el nivel de evacuación",
    statusUnknown: "Sin niveles oficiales publicados",
    noData: "sin dato",
    alertShort: "Alerta",
    evacShort: "Evac.",
    inDays: (n) => (n === 1 ? "en 1 día" : "en " + n + " días"),
    flagRegulated: "regulado por represa",
    flagTide: "afectado por marea",
    branchPalmas: "Paraná de las Palmas",
    branchGuazu: "Paraná Guazú",
    branchIbicuy: "Ibicuy",
    branchVictoria: "Riacho Victoria",
    branchEstuary: "estuario",
    stale: (n) => "(" + n + " días de atraso)",
    method: "Niveles del día de la API a5 del INA. Los niveles de alerta y evacuación se extraen del reporte diario del INA; donde el INA no publica un nivel, la estación aparece sin niveles oficiales y nunca con un valor estimado. Los datos pasan un conjunto de pruebas antes de publicarse: si una prueba falla, no se actualiza nada y queda a la vista la fecha del último dato bueno.",
    credits: "Fuente: Instituto Nacional del Agua (INA), Argentina. Código abierto.",
  },
  en: {
    htmlLang: "en",
    locale: "en-GB",
    title: "Paraná flood tracker",
    subtitle: "The river today, from Puerto Iguazú to San Fernando",
    langGroup: "Language",
    noticeStrong: "This is not an alert system.",
    noticeBody: "Alert and evacuation levels, warnings and official forecasts are published by Argentina's Instituto Nacional del Agua.",
    officialLink: "See INA's official alert →",
    dataTo: "Data to",
    thresholdsFrom: "Official levels from",
    generatedAt: "Generated",
    tallyEvac: "above evacuation",
    tallyAlert: "above alert",
    tallyRising: "rising",
    tallyOfficial: "with official levels",
    listHeading: "Gauges, upstream to downstream",
    viewsNav: "Views",
    viewToday: "The river today",
    viewWave: "The wave",
    viewDrivers: "Upstream",
    viewFlood: "Flooded area",
    viewMap: "Map",
    statusBelow: "Below the alert level",
    statusAlert: "Above the alert level",
    statusEvacuation: "Above the evacuation level",
    statusUnknown: "No official levels published",
    noData: "no data",
    alertShort: "Alert",
    evacShort: "Evac.",
    inDays: (n) => (n === 1 ? "in 1 day" : "in " + n + " days"),
    flagRegulated: "dam-regulated",
    flagTide: "tide-affected",
    branchPalmas: "Paraná de las Palmas",
    branchGuazu: "Paraná Guazú",
    branchIbicuy: "Ibicuy",
    branchVictoria: "Riacho Victoria",
    branchEstuary: "estuary",
    stale: (n) => "(" + n + " days behind)",
    method: "Daily levels from INA's a5 API. Alert and evacuation levels are parsed from INA's daily report; where INA publishes no level, the gauge is shown as having none and never with an estimated value. The data passes a set of tests before it is published: if a test fails nothing is updated, and the date of the last good reading stays visible.",
    credits: "Source: Instituto Nacional del Agua (INA), Argentina. Open source.",
  },
};

const BRANCH_KEY = {
  palmas: "branchPalmas",
  guazu: "branchGuazu",
  ibicuy: "branchIbicuy",
  victoria: "branchVictoria",
  estuary: "branchEstuary",
};

let lang = "es";
let payload = null;

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem("crecida.lang"); } catch (e) { /* private mode */ }
  if (saved === "es" || saved === "en") return saved;
  return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("crecida.lang", next); } catch (e) { /* ignore */ }
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  for (const el of document.querySelectorAll("[data-t]")) {
    const value = t[el.dataset.t];
    if (typeof value === "string") el.textContent = value;
  }
  for (const el of document.querySelectorAll("[data-t-aria]")) {
    el.setAttribute("aria-label", t[el.dataset.tAria] || "");
  }
  for (const b of document.querySelectorAll(".langs button")) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  if (payload) render(payload);
}

function num(value, unit) {
  if (value === null || value === undefined) return null;
  const digits = unit === "m3/s" ? 0 : 2;
  return new Intl.NumberFormat(T[lang].locale, {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits,
  }).format(value);
}

function signed(value, unit) {
  const text = num(Math.abs(value), unit);
  const sign = value > 0 ? "+" : value < 0 ? "−" : "±";
  return sign + text;
}

function longDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T12:00:00");
  return new Intl.DateTimeFormat(T[lang].locale, {
    day: "numeric", month: "long", year: "numeric",
  }).format(d);
}

function shortDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return new Intl.DateTimeFormat(T[lang].locale, {
    day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
  }).format(d);
}

function tag(text) {
  const span = document.createElement("span");
  span.className = "tag";
  span.textContent = text;
  return span;
}

function gaugeItem(g) {
  const t = T[lang];
  const li = document.createElement("li");
  li.className = "gauge";
  li.dataset.status = g.status;

  const left = document.createElement("div");
  const name = document.createElement("p");
  name.className = "name";
  name.textContent = g.name;
  left.appendChild(name);

  const tags = document.createElement("div");
  tags.className = "tags";
  const branchKey = BRANCH_KEY[g.branch];
  if (branchKey) tags.appendChild(tag(t[branchKey]));
  if (g.flags.includes("regulated")) tags.appendChild(tag(t.flagRegulated));
  if (g.flags.includes("tide_affected")) tags.appendChild(tag(t.flagTide));
  if (tags.childElementCount) left.appendChild(tags);

  const status = document.createElement("div");
  status.className = "status";
  status.textContent =
    g.status === "evacuation" ? t.statusEvacuation
    : g.status === "alert" ? t.statusAlert
    : g.status === "below" ? t.statusBelow
    : t.statusUnknown;
  left.appendChild(status);
  li.appendChild(left);

  const right = document.createElement("div");
  right.className = "reading";
  if (g.value === null) {
    const none = document.createElement("div");
    none.className = "nodata";
    none.textContent = t.noData;
    right.appendChild(none);
  } else {
    const level = document.createElement("div");
    level.className = "level";
    level.textContent = num(g.value, g.unit);
    const unit = document.createElement("span");
    unit.className = "unit";
    unit.textContent = g.unit === "m3/s" ? "m³/s" : "m";
    level.appendChild(unit);
    right.appendChild(level);

    if (g.change !== null) {
      const change = document.createElement("div");
      change.className = "change " + (g.change > 0 ? "up" : g.change < 0 ? "down" : "");
      const days = g.change_days && g.change_days !== 1 ? " " + t.inDays(g.change_days) : "";
      change.textContent = signed(g.change, g.unit) + days;
      right.appendChild(change);
    }
  }
  li.appendChild(right);

  // The bar is drawn only when there is something official to draw it
  // against. An invented scale would imply a threshold that does not exist.
  if (g.value !== null && (g.alert !== null || g.evacuation !== null)) {
    const lines = [g.alert, g.evacuation].filter((v) => v !== null);
    const top = Math.max(g.value, ...lines) * 1.12;
    const bar = document.createElement("div");
    bar.className = "bar";

    const track = document.createElement("div");
    track.className = "track";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = Math.max(0, Math.min(100, (g.value / top) * 100)) + "%";
    track.appendChild(fill);
    for (const [value, cls] of [[g.alert, "a"], [g.evacuation, "e"]]) {
      if (value === null) continue;
      const tick = document.createElement("div");
      tick.className = "tick " + cls;
      tick.style.left = (value / top) * 100 + "%";
      track.appendChild(tick);
    }
    bar.appendChild(track);

    const scale = document.createElement("div");
    scale.className = "scale";
    const a = document.createElement("span");
    a.textContent = g.alert === null ? "" : t.alertShort + " " + num(g.alert, g.unit);
    const e = document.createElement("span");
    e.textContent = g.evacuation === null ? "" : t.evacShort + " " + num(g.evacuation, g.unit);
    scale.append(a, e);
    bar.appendChild(scale);
    li.appendChild(bar);
  }

  return li;
}

function render(data) {
  const t = T[lang];
  const gauges = data.gauges || [];

  document.getElementById("lastDay").textContent = longDate(data.last_data_day);
  const fresh = document.getElementById("fresh");
  const age = data.data_age_days;
  if (age !== null && age !== undefined && age > 1) {
    fresh.textContent = t.stale(age);
    fresh.className = age > 7 ? "stale" : "";
  } else {
    fresh.textContent = "";
    fresh.className = "";
  }
  document.getElementById("thrDate").textContent = longDate(
    (data.thresholds || {}).source_date
  );
  document.getElementById("genAt").textContent = shortDateTime(data.generated_at);
  document.getElementById("meta").hidden = false;

  document.getElementById("nEvac").textContent = gauges.filter((g) => g.status === "evacuation").length;
  document.getElementById("nAlert").textContent = gauges.filter((g) => g.status === "alert").length;
  document.getElementById("nRising").textContent = gauges.filter((g) => g.change !== null && g.change > 0).length;
  document.getElementById("nOfficial").textContent = gauges.filter((g) => g.alert !== null || g.evacuation !== null).length;
  document.getElementById("tally").hidden = false;

  const list = document.getElementById("list");
  list.replaceChildren(...gauges.map(gaugeItem));
}

function fail(message) {
  const box = document.getElementById("error");
  box.textContent = message;
  box.hidden = false;
}

for (const b of document.querySelectorAll(".langs button")) {
  b.addEventListener("click", () => setLang(b.dataset.lang));
}

setLang(pickLang());

fetch("data/river_today.json", { cache: "no-cache" })
  .then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then((data) => {
    payload = data;
    render(data);
  })
  .catch((err) => fail("No se pudieron cargar los datos / could not load data: " + err.message));
</script>
</body>
</html>
