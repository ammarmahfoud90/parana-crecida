  </p>

  <div id="error" class="err" role="alert" hidden></div>

  <!-- The finding, before any measurement: how much of the valley is wet,
       and how much wetter than the driest pass on the record. -->

    <span class="big" id="area">–</span>

    <p class="say" id="areaNote"></p>

      <div><dt data-t="riseLabel"></dt><dd id="rise"></dd></div>
    </dl>
  </div>

  <h2 class="section major" style="margin-top:34px" data-t="chartHeading"></h2>
  <p class="cap measure" style="color:var(--ink-soft);font-size:.9rem" data-t="chartLead"></p>
  <div class="chartbox">
    <svg id="chart" class="floodchart" role="img" aria-labelledby="chartTitle chartDesc">

      <desc id="chartDesc"></desc>
    </svg>
  </div>

  </div>

      <canvas id="loopFrame" hidden aria-hidden="true"></canvas>
      <button type="button" id="loopToggle" class="playbtn loopbtn playing"></button>
    </div>
    <figcaption id="loopCaption"></figcaption>
  </figure>

  <!-- How good the instrument is. Published because a water mask with no
       score attached is a picture, not a measurement. -->
  <h2 class="section major" style="margin-top:34px" data-t="skillHeading"></h2>
  <p class="cap measure" style="color:var(--ink-soft);font-size:.9rem" id="skillLead"></p>

  <p class="cap measure" style="color:var(--ink-soft);font-size:.9rem" data-t="skillWhat"></p>

  <h2 class="section major" style="margin-top:34px" data-t="limitsHeading"></h2>
  <ul class="limits measure">

    <li data-t="limitWindow"></li>

const SVG = "http://www.w3.org/2000/svg";
let lang = "es";
let payload = null;
let film = null;

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem("crecida.lang"); } catch (e) { /* private mode */ }
  if (saved === "es" || saved === "en") return saved;
  return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("crecida.lang", next); } catch (e) { /* ignore */ }
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  for (const el of document.querySelectorAll("[data-t]")) {
    const v = t[el.dataset.t];
    if (typeof v === "string") el.textContent = v;
  }
  for (const el of document.querySelectorAll("[data-t-aria]")) {
    el.setAttribute("aria-label", t[el.dataset.tAria] || "");
  }
  for (const el of document.querySelectorAll("[data-t-alt]")) {
    el.setAttribute("alt", t[el.dataset.tAlt] || "");
  }
  for (const b of document.querySelectorAll(".langs button")) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  document.getElementById("chartTitle").textContent = t.chartTitle;
  loopToggle.setAttribute("aria-label", loopRunning ? t.pauseLoop : t.playLoop);
  if (payload) render(payload);
  if (film) describeFilm(film);
  else document.getElementById("loopCaption").textContent = T[lang].loopCaptionFlat;
}

function describeFilm(data) {
  const frames = data.frames || [];
  if (!frames.length) return;
  document.getElementById("loopCaption").textContent = T[lang].loopCaption(
    num(Math.round(data.river_km || 0)), frames.length,
    longDay(frames[0].end), longDay(frames[frames.length - 1].end));
}

function el(name, attrs, text) {
  const n = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}

function niceStep(raw) {
  const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const multiple of [1, 2, 2.5, 5, 10]) {
    if (magnitude * multiple >= raw) return magnitude * multiple;
  }
  return magnitude * 10;
}

function num(v, digits) {
  return new Intl.NumberFormat(T[lang].locale, {
    minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0,
  }).format(v);
}

function dayLabel(iso) {
  return new Intl.DateTimeFormat(T[lang].locale, { day: "numeric", month: "short" })
    .format(new Date(iso + "T12:00:00"));
}

function longDay(iso) {
  return new Intl.DateTimeFormat(T[lang].locale, {
    day: "numeric", month: "long", year: "numeric",
  }).format(new Date(iso + "T12:00:00"));
}

function drawChart(rows) {
  const t = T[lang];
  const svg = document.getElementById("chart");
  // Keep everything up to and including <desc>, which aria-labelledby points
  // at, and drop the drawing below it. Counting child nodes instead counts
  // the whitespace between tags and deletes the <desc>.
  const keep = document.getElementById("chartDesc");
  while (svg.lastChild && svg.lastChild !== keep) svg.removeChild(svg.lastChild);
  if (rows.length < 2) return;

  const W = 760, H = 320, L = 58, R = 16, TOP = 16, B = 46;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const plotW = W - L - R, plotH = H - TOP - B;

  const water = rows.map((r) => r.water_km2);
  const top = Math.max(...water) * 1.08;
  const x = (i) => L + (rows.length === 1 ? plotW / 2 : (i * plotW) / (rows.length - 1));
  const y = (v) => TOP + plotH - (v / top) * plotH;

  // Horizontal rules with their values, so the shape can be read as numbers.
  // Round gridlines. Dividing the data maximum into four gave 2,626 /
  // 5,253 / 7,879 / 10,506 - four numbers nobody can hold in their head
  // and none of them a quantity anyone would choose to mark.
  const step = niceStep(top / 4);
  for (let value = 0; value <= top; value += step) {
    svg.appendChild(el("line", {
      x1: L, x2: W - R, y1: y(value), y2: y(value),
      stroke: "var(--line)", "stroke-width": 1,
    }));
    svg.appendChild(el("text", {
      x: L - 8, y: y(value) + 4, "text-anchor": "end",
      fill: "var(--ink-faint)", "font-size": 11,
    }, num(value)));
  }
  // Inside the plot rather than over the top tick, which it sat on.
  svg.appendChild(el("text", {
    x: L + 4, y: TOP + 10, "text-anchor": "start",
    fill: "var(--ink-faint)", "font-size": 11,
  }, t.axisKm2));

  const path = (values, dashed) => {
    const d = values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
    const attrs = {
      d, fill: "none", stroke: dashed ? "var(--evac)" : "var(--accent)",
      "stroke-width": dashed ? 2 : 2.6, "stroke-linejoin": "round",
    };
    if (dashed) attrs["stroke-dasharray"] = "5 4";
    svg.appendChild(el("path", attrs));
  };
  path(water, false);
  path(rows.map((r) => r.flood_km2), true);

  for (let i = 0; i < rows.length; i += 1) {
    svg.appendChild(el("circle", {
      cx: x(i), cy: y(water[i]), r: 2.6, fill: "var(--accent)",
    }));
  }

  // A date label roughly every other month, and always the last one. The
  // last is chosen first and the run works backwards from it, because
  // forcing it on at the end put it on top of the label before it.
  const GAP = 76;
  const labels = [rows.length - 1];
  for (let i = rows.length - 2; i >= 0; i -= 1) {
    if (x(labels[labels.length - 1]) - x(i) >= GAP) labels.push(i);
  }
  labels.reverse();
  for (const i of labels) {
    svg.appendChild(el("text", {
      x: x(i), y: H - B + 20, "text-anchor": "middle",
      fill: "var(--ink-faint)", "font-size": 11,
    }, dayLabel(rows[i].day)));
  }

  const lowAt = water.indexOf(Math.min(...water));
  const lastAt = rows.length - 1;
  for (const [index, key, anchor] of [[lowAt, "chartLow", "start"],
                                      [lastAt, "chartNow", "end"]]) {
    if (index < 0) continue;
    const cx = x(index), cy = y(water[index]);
    svg.appendChild(el("circle", {
      cx, cy, r: 5, fill: "none",
      stroke: index === lastAt ? "var(--evac)" : "var(--ink-faint)",
      "stroke-width": 2,
    }));
    const dx = anchor === "end" ? -10 : 10;
    svg.appendChild(el("text", {
      x: cx + dx, y: cy - 12, "text-anchor": anchor,
      fill: index === lastAt ? "var(--evac)" : "var(--ink-faint)",
      "font-size": 11.5, "font-weight": index === lastAt ? 650 : 500,
    }, `${t[key]} ${num(Math.round(water[index]))}`));
  }

  const lo = Math.min(...water), hi = Math.max(...water);
  document.getElementById("chartDesc").textContent = t.chartDesc(
    longDay(rows[0].day), longDay(rows[rows.length - 1].day), num(lo), num(hi));
  document.getElementById("keys").hidden = false;
}

function drawSkill(skill) {
  const t = T[lang];
  const body = document.getElementById("skillRows");
  body.textContent = "";

  // One row per stretch, because a single river-wide figure hides that the
  // method is near 0.9 in the gorge and near 0.5 below Corrientes, and
  // which end of that a given number came from is the reader's business.
  const line = (label, now, before, strong) => {
    const tr = document.createElement("tr");
    if (strong) tr.className = "now";
    const th = document.createElement("th");
    th.scope = "row";
    th.textContent = label;
    tr.appendChild(th);
    const cells = [now.recall, now.precision, now.iou, before && before.iou];
    for (const v of cells) {
      const td = document.createElement("td");
      td.textContent = v === null || v === undefined ? "–" : num(v, 2);
      tr.appendChild(td);
    }
    body.appendChild(tr);
  };

  for (const s of skill.stretches || []) {
    line(`${s.from_name} – ${s.to_name}`, s.now || {}, s.previous, false);
  }
  line(t.skillWhole, skill, skill.previous || {}, true);

  document.getElementById("skillLead").textContent = t.skillLead(
    skill.day ? longDay(skill.day) : (skill.measured_against || "Sentinel-2"),
    (skill.stretches || []).length);
}

function render(data) {
  const t = T[lang];
  const rows = (data.river || []).filter((r) => r.complete);
  const latest = data.latest, low = data.lowest;

  if (latest) {
    document.getElementById("area").textContent = num(Math.round(latest.water_km2));
    document.getElementById("areaCap").textContent = t.areaCap;
    document.getElementById("areaNote").textContent = low && low.day !== latest.day
      ? t.areaNote(longDay(latest.day), num(Math.round(latest.water_km2 - low.water_km2)),
                   num(Math.round(low.water_km2)), longDay(low.day))
      : t.areaNoteFlat(longDay(latest.day));
    const beyond = document.getElementById("floodNote");
    if (low && low.flood_km2 > 0 && low.day !== latest.day) {
      beyond.textContent = t.floodNote(
        num(Math.round(latest.flood_km2)), num(Math.round(low.flood_km2)),
        num(latest.flood_km2 / low.flood_km2, 1));
      beyond.hidden = false;
    } else {
      beyond.hidden = true;
    }
    document.getElementById("headline").hidden = false;

    document.getElementById("passDay").textContent = longDay(latest.day);
    document.getElementById("reach").textContent =
      t.reachValue(num(Math.round(riverKm(data))), latest.stretches);
    document.getElementById("rise").textContent = low
      ? `+${num(Math.round(((latest.water_km2 / low.water_km2) - 1) * 100))}%`
      : "–";
    document.getElementById("meta").hidden = false;
  }

  drawChart(rows);
  if (data.skill) drawSkill(data.skill);
}

function riverKm(data) {
  if (typeof data.river_km === "number") return data.river_km;
  return (data.stretches || []).reduce((sum, s) => sum + (s.river_km || 0), 0);
}

// -- the animation ---------------------------------------------------------

const loopImg = document.getElementById("loop");
const loopFrame = document.getElementById("loopFrame");
const loopToggle = document.getElementById("loopToggle");
let loopRunning = true;

function freezeLoop() {
  // A GIF cannot be paused, so the first frame is painted to a canvas and
  // the canvas is shown in its place.
  const w = loopImg.naturalWidth, h = loopImg.naturalHeight;
  if (w && h) {
    loopFrame.width = w;
    loopFrame.height = h;
    loopFrame.getContext("2d").drawImage(loopImg, 0, 0);
    loopFrame.hidden = false;
    loopImg.hidden = true;
  }
  loopRunning = false;
  loopToggle.classList.remove("playing");
  loopToggle.setAttribute("aria-label", T[lang].playLoop);
}

function runLoop() {
  loopFrame.hidden = true;
  loopImg.hidden = false;
  loopRunning = true;
  loopToggle.classList.add("playing");
  loopToggle.setAttribute("aria-label", T[lang].pauseLoop);
}

loopToggle.addEventListener("click", () => (loopRunning ? freezeLoop() : runLoop()));

function settleLoop() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) freezeLoop();
  else runLoop();
}
if (loopImg.complete) settleLoop();
else loopImg.addEventListener("load", settleLoop);

for (const b of document.querySelectorAll(".langs button")) {
  b.addEventListener("click", () => setLang(b.dataset.lang));
}

setLang(pickLang());

fetch("data/river_film.json", { cache: "no-cache" })
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => { film = d; if (d) describeFilm(d); })
  .catch(() => { /* the caption falls back to the flat wording */ });

fetch("data/floodwater.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((data) => { payload = data; render(data); })
  .catch((err) => {
    const box = document.getElementById("error");
    box.textContent = "No se pudieron cargar los datos / could not load data: " + err.message;
    box.hidden = false;
  });
</script>
