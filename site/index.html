<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Paraná desde el espacio · Crecida del Paraná</title>
<meta name="description" content="Cuánta superficie cubre el río Paraná, medida por radar Sentinel-1 cada doce días a lo largo de 1.477 km y puntuada contra agua óptica.">
<meta name="theme-color" content="#0c1214">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Imbue:opsz,wght@10..100,400&family=Albert+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<a class="skip" href="#content" data-t="skipLink"></a>

<header class="bar">
  <a class="mark" href="index.html" data-t-aria="homeLink">Paraná</a>
  <nav class="views" data-t-aria="viewsNav">
    <a href="index.html" aria-current="page" data-t="viewSpace"></a>
    <a href="map.html" data-t="viewMap"></a>
    <a href="gauges.html" data-t="viewToday"></a>
    <a href="method.html" data-t="viewMethod"></a>
  </nav>
  <div class="langs" role="group" data-t-aria="langGroup">
    <button type="button" data-lang="es" aria-pressed="true">ES</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <a class="btn" href="#film" data-t="ctaFilm"></a>
</header>

<main id="content" tabindex="-1">

  <!-- The masthead: the river's own corridors, as the satellite sees them in
       false colour, butted against flat fields in the river's colours. -->
  <div class="mosaic">
    <div class="cell-img cell-a">
      <img src="media/basemap/ita_ibate_corrientes.webp" width="2048" height="682"
           data-t-alt="altItaCorrientes" alt="" fetchpriority="high">
    </div>
    <div class="cell-img cell-b">
      <img src="media/basemap/libertador_posadas.webp" width="2048" height="1848"
           data-t-alt="altLibertadorPosadas" alt="">
    </div>
    <div class="cell-water" aria-hidden="true"></div>
    <div class="cell-tall">
      <div class="tile-text">
        <span><span class="tile-big fig" id="area">–</span>
              <span class="tile-unit" id="areaCap"></span>
              <span class="tile-when" id="tileWindow"></span></span>
      </div>
    </div>
    <div class="cell-silt" aria-hidden="true"></div>
    <div class="cell-green">
      <div class="tile-text"><span class="tile-note" data-t="mastNote"></span></div>
    </div>
    <div class="cell-img cell-d">
      <img src="media/basemap/goya_la_paz.webp" width="734" height="2048"
           data-t-alt="altGoyaLaPaz" alt="">
    </div>
    <div class="cell-img cell-c">
      <img src="media/basemap/la_paz_parana.webp" width="1745" height="2048"
           data-t-alt="altLaPazParana" alt="">
    </div>
  </div>

  <div class="page">
    <section class="opening" aria-labelledby="title">
      <div class="side">
        <p class="standfirst rise" data-t="subtitle"></p>
        <p class="notice rise" style="--i:1">
          <strong data-t="noticeStrong"></strong>
          <span data-t="noticeBody"></span>
          <a href="https://alerta.ina.gob.ar/" target="_blank" rel="noopener" data-t="officialLink"></a>
        </p>
      </div>
      <div>
        <h1 class="display" id="title">
          <span class="line reveal-line"><span data-t="titleA"></span></span>
          <span class="line reveal-line"><span data-t="titleB"></span></span>
        </h1>
        <div class="readout" id="headline">
          <div id="error" class="err" role="alert" hidden></div>
          <!-- Withheld, not broken: its own box, its own wording, no alert role. -->
          <p class="warn" id="riverUnavailable" hidden></p>
          <p class="say rise" id="areaNote"></p>
          <p class="say rise" id="ageNote" style="--i:1"></p>
          <p class="say rise" id="floodNote" style="--i:2" hidden></p>
          <p class="warn" id="sumWarning" hidden></p>
        </div>
        <dl class="facts rise" id="meta" style="--i:3" hidden>
          <div><dt data-t="passLabel"></dt><dd id="passWindow"></dd></div>
          <div><dt data-t="reachLabel"></dt><dd id="reach"></dd></div>
          <div><dt data-t="riseLabel"></dt><dd id="rise"></dd></div>
        </dl>
      </div>
    </section>
  </div>

  <!-- A year of river: the series, with the two figures it is read by. -->
  <section class="chapter year page" aria-labelledby="chartHeading">
    <h2 class="h2 on-axis rise" id="chartHeading" data-t="chartHeading"></h2>
    <div class="ymosaic">
      <div class="plate">
        <p class="lead rise" data-t="chartLead"></p>
        <p class="lead" id="chartEmpty" data-t="chartNone" hidden></p>
        <div class="floodkeys" id="keys" hidden>
          <span><svg width="28" height="6" aria-hidden="true"><rect y="1" width="28" height="4" fill="var(--channel)"/></svg><span data-t="keyWater"></span></span>
          <span><svg width="28" height="6" aria-hidden="true"><rect y="1" width="8" height="4" fill="var(--flood)"/><rect x="11" y="1" width="8" height="4" fill="var(--flood)"/><rect x="22" y="1" width="6" height="4" fill="var(--flood)"/></svg><span data-t="keyFlood"></span></span>
        </div>
        <div class="chartbox rise" style="--i:1">
          <svg id="chart" class="floodchart" role="img" aria-labelledby="chartTitle chartDesc">
            <title id="chartTitle"></title>
            <desc id="chartDesc"></desc>
          </svg>
        </div>
      </div>
      <div class="ftile silt rise" style="--i:2">
        <span class="fig" id="riseTile">–</span>
        <p data-t="riseCap"></p>
      </div>
      <div class="ftile green rise" style="--i:3">
        <span class="fig" id="lowTile">–</span>
        <p id="lowCap"></p>
      </div>
    </div>
  </section>

  <!-- The reaches, each in its own corridor. -->
  <section class="chapter reaches" aria-labelledby="reachesHeading">
    <h2 class="h2 rise" id="reachesHeading" data-t="reachesHeading"></h2>
    <div class="band">
      <figure class="panel">
        <img src="media/basemap/puerto_iguazu_libertador.webp" width="996" height="2048"
             loading="lazy" decoding="async" data-t-alt="altIguazuLibertador" alt="">
        <p class="panel-title" data-t="reachesTitle"></p>
        <figcaption data-t="capIguazu"></figcaption>
      </figure>
      <figure class="panel">
        <img src="media/basemap/posadas_ita_ibate.webp" width="2048" height="664"
             loading="lazy" decoding="async" data-t-alt="altPosadasIta" alt="">
        <figcaption data-t="capPosadas"></figcaption>
      </figure>
      <figure class="panel">
        <img src="media/basemap/corrientes_goya.webp" width="806" height="2048"
             loading="lazy" decoding="async" data-t-alt="altCorrientesGoya" alt="">
        <figcaption data-t="capCorrientes"></figcaption>
      </figure>
      <figure class="panel">
        <img src="media/basemap/parana_villa_constitucion.webp" width="864" height="2048"
             loading="lazy" decoding="async" data-t-alt="altParanaVilla" alt="">
        <figcaption data-t="capParana"></figcaption>
      </figure>
    </div>
    <p class="band-cap">
      <span data-t="reachesCap"></span>
      <a href="flood.html" data-t="alsoFlood"></a>
    </p>
  </section>

  <!-- The film, and the one thing a reader can do: hold any window still
       and read the figure measured for it. -->
  <section class="chapter film field field-water" id="film" aria-labelledby="loopHeading">
    <div class="head">
      <h2 class="h2 rise" id="loopHeading" data-t="loopHeading"></h2>
      <p class="lead rise" style="--i:1" data-t="filmLead"></p>
    </div>
    <div class="filmgrid">
      <figure class="screen rise">
        <img src="media/river.gif" alt="" id="loop" data-t-alt="loopAlt"
             width="999" height="1400" loading="lazy" decoding="async">
        <canvas id="loopFrame" hidden aria-hidden="true"></canvas>
        <img id="still" alt="" hidden width="999" height="1400">
      </figure>
      <div class="console">
        <div class="ctrl rise" style="--i:1">
          <span class="when" id="scrubWhen" aria-live="polite">–</span>
          <span><span class="fig" id="scrubKm">–</span>
                <span class="unit" data-t="scrubUnit"></span></span>
          <label for="scrub" data-t="scrubLabel"></label>
          <input type="range" id="scrub" min="0" max="0" value="0" step="1" disabled>
          <div class="row">
            <button type="button" id="loopToggle" class="btn ink playing"></button>
          </div>
        </div>
        <dl class="facts2 rise" style="--i:2">
          <div><dt data-t="filmFramesLabel"></dt><dd id="filmFrames">–</dd></div>
          <div><dt data-t="filmWindowLabel"></dt><dd id="filmWindow">–</dd></div>
          <div><dt data-t="filmRiverLabel"></dt><dd id="filmRiver">–</dd></div>
          <div><dt data-t="filmStretchesLabel"></dt><dd id="filmStretches">–</dd></div>
        </dl>
      </div>
    </div>
    <p class="cap" id="loopCaption"></p>
  </section>

  <!-- How good the instrument is. Published because a reader has no way
       to weigh an area figure without knowing how often the mask is right. -->
  <section class="chapter skill-sec page" aria-labelledby="skillHeading">
    <h2 class="h2 display rise" id="skillHeading">
      <span data-t="skillHeadA"></span>
      <span class="indent" data-t="skillHeadB"></span>
    </h2>
    <div class="tablewrap rise" style="--i:1">
      <table class="skill">
        <caption class="vh" data-t="skillCaption"></caption>
        <thead>
          <tr>
            <th scope="col" data-t="skillMethod"></th>
            <th scope="col" data-t="skillRecall"></th>
            <th scope="col" data-t="skillPrecision"></th>
            <th scope="col" data-t="skillIou"></th>
            <th scope="col" data-t="skillWas"></th>
          </tr>
        </thead>
        <tbody id="skillRows"></tbody>
      </table>
    </div>
    <div class="cols on-axis">
      <p class="rise" id="skillLead"></p>
      <p class="rise" style="--i:1" data-t="skillWhat"></p>
      <p class="rise" style="--i:2" data-t="skillCaveat"></p>
    </div>
  </section>

  <section class="chapter limits-sec field field-silt" aria-labelledby="limitsHeading">
    <h2 class="h2 rise" id="limitsHeading">
      <span class="soft" data-t="limitsHeadA"></span>
      <span data-t="limitsHeadB"></span>
    </h2>
    <ul class="limits">
      <li class="rise"><span class="name" data-t="limitTreesName"></span>
          <div class="text"><p data-t="limitTrees"></p></div></li>
      <li class="rise" style="--i:1"><span class="name" data-t="limitUrbanName"></span>
          <div class="text"><p data-t="limitUrban"></p></div></li>
      <li class="rise" style="--i:2"><span class="name" data-t="limitWindowName"></span>
          <div class="text"><p data-t="limitWindow"></p></div></li>
      <li class="rise" style="--i:3"><span class="name" data-t="limitDeltaName"></span>
          <div class="text"><p data-t="limitDelta"></p></div></li>
      <li class="rise" style="--i:4"><span class="name" data-t="limitFloorName"></span>
          <div class="text"><p data-t="limitFloor"></p></div></li>
    </ul>
  </section>

  <section class="prov field field-green" aria-labelledby="provHeading">
    <h2 class="h2 rise" id="provHeading" data-t="provHeading"></h2>
    <p class="lead rise" style="--i:1" data-t="provLead"></p>
    <dl class="provgrid">
      <div class="rise"><dt data-t="provMeasuredLabel"></dt><dd data-t="provMeasured"></dd></div>
      <div class="rise" style="--i:1"><dt data-t="provCalculatedLabel"></dt><dd data-t="provCalculated"></dd></div>
      <div class="rise" style="--i:2"><dt data-t="provMissingLabel"></dt><dd data-t="provMissing"></dd></div>
    </dl>
    <h3 class="vh" data-t="alsoHeading"></h3>
    <ul class="also">
      <li class="rise"><a href="flood.html" data-t="alsoFlood"></a>
          <span data-t="alsoFloodWhy"></span></li>
      <li class="rise" style="--i:1"><a href="map.html" data-t="alsoMap"></a>
          <span data-t="alsoMapWhy"></span></li>
      <li class="rise" style="--i:2"><a href="gauges.html" data-t="alsoGauges"></a>
          <span data-t="alsoGaugesWhy"></span></li>
    </ul>
  </section>
</main>

const SVG = "http://www.w3.org/2000/svg";
let lang = "es";
let payload = null;
let film = null;

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem("crecida.lang"); } catch (e) { /* private mode */ }
  if (saved === "es" || saved === "en") return saved;
  return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("crecida.lang", next); } catch (e) { /* ignore */ }
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = `${t.title} · ${lang === "es" ? "Crecida del Paraná" : "Paraná flood tracker"}`;
  for (const node of document.querySelectorAll("[data-t]")) {
    const v = t[node.dataset.t];
    if (typeof v === "string") node.textContent = v;
  }
  for (const node of document.querySelectorAll("[data-t-aria]")) {
    node.setAttribute("aria-label", t[node.dataset.tAria] || "");
  }
  for (const node of document.querySelectorAll("[data-t-alt]")) {
    node.setAttribute("alt", t[node.dataset.tAlt] || "");
  }
  for (const b of document.querySelectorAll(".langs button")) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  document.getElementById("chartTitle").textContent = t.chartTitle;
  labelToggle();
  if (payload) render(payload);
  if (film) describeFilm(film);
  else document.getElementById("loopCaption").textContent = T[lang].loopCaptionFlat;
}

function el(name, attrs, text) {
  const n = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}

function niceStep(raw) {
  const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const multiple of [1, 2, 2.5, 5, 10]) {
    if (magnitude * multiple >= raw) return magnitude * multiple;
  }
  return magnitude * 10;
}

function num(v, digits) {
  return new Intl.NumberFormat(T[lang].locale, {
    minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0,
  }).format(v);
}

function dayLabel(iso) {
  return new Intl.DateTimeFormat(T[lang].locale, { day: "numeric", month: "short" })
    .format(new Date(iso + "T12:00:00"));
}

function longDay(iso) {
  return new Intl.DateTimeFormat(T[lang].locale, {
    day: "numeric", month: "long", year: "numeric",
  }).format(new Date(iso + "T12:00:00"));
}

function drawChart(rows, data) {
  const t = T[lang];
  const svg = document.getElementById("chart");
  // Keep everything up to and including <desc>, which aria-labelledby points
  // at, and drop the drawing below it. Counting child nodes instead counts
  // the whitespace between tags and deletes the <desc>.
  const keep = document.getElementById("chartDesc");
  while (svg.lastChild && svg.lastChild !== keep) svg.removeChild(svg.lastChild);
  if (rows.length < 2) return;

  const W = 860, H = 400, L = 62, R = 18, TOP = 22, B = 48;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const plotW = W - L - R, plotH = H - TOP - B;

  const water = rows.map((r) => r.water_km2);
  const top = Math.max(...water) * 1.1;
  const x = (i) => L + (rows.length === 1 ? plotW / 2 : (i * plotW) / (rows.length - 1));
  const y = (v) => TOP + plotH - (v / top) * plotH;

  // Round values marked as tone bands rather than ruled lines, so the shape
  // can still be read as numbers.
  const step = niceStep(top / 4);
  let band = 0;
  for (let value = 0; value <= top; value += step) {
    const upper = Math.min(value + step, top);
    if (band % 2 === 0) {
      svg.appendChild(el("rect", {
        x: L, width: plotW, y: y(upper), height: y(value) - y(upper),
        fill: "var(--surface)", opacity: 0.55,
      }));
    }
    band += 1;
    svg.appendChild(el("text", {
      x: L - 10, y: y(value) + 5, "text-anchor": "end",
      fill: "var(--muted)", "font-size": 14,
    }, num(value)));
  }
  svg.appendChild(el("text", {
    x: L + 6, y: TOP + 14, "text-anchor": "start",
    fill: "var(--muted)", "font-size": 14,
  }, t.axisKm2));

  // Cycles that could not be measured are absent from the series, not
  // zero - so the line must break at them rather than run straight from
  // the cycle before to the cycle after, which would draw a measurement
  // nobody made and hide that anything was missing. A cycle end more than
  // one window after its predecessor is a gap.
  const DAY = 86400000;
  const gapAfter = (i) => {
    if (i + 1 >= rows.length) return false;
    const a = new Date(rows[i].day + "T12:00:00");
    const b = new Date(rows[i + 1].day + "T12:00:00");
    return (b - a) / DAY > (data.window_days || 12) * 1.5;
  };

  // And the gap is marked, so the break reads as "not measured" rather
  // than as a rendering fault: a tone column with its label.
  for (let i = 0; i < rows.length - 1; i += 1) {
    if (!gapAfter(i)) continue;
    svg.appendChild(el("rect", {
      x: x(i) + 4, width: Math.max(4, x(i + 1) - x(i) - 8), y: TOP, height: plotH,
      fill: "var(--water)", opacity: 0.6,
    }));
    svg.appendChild(el("text", {
      x: (x(i) + x(i + 1)) / 2, y: TOP + plotH - 10, "text-anchor": "middle",
      fill: "var(--ink)", "font-size": 14,
    }, t.chartGap));
  }

  const path = (values, dashed) => {
    const parts = values.map((v, i) => {
      const point = `${x(i).toFixed(1)} ${y(v).toFixed(1)}`;
      // Start a fresh subpath after a gap as well as at the beginning.
      return `${i === 0 || gapAfter(i - 1) ? "M" : "L"}${point}`;
    });
    const attrs = {
      d: parts.join(" "), fill: "none",
      stroke: dashed ? "var(--flood)" : "var(--channel)",
      "stroke-width": dashed ? 2.4 : 3, "stroke-linejoin": "round",
    };
    if (dashed) attrs["stroke-dasharray"] = "7 4";
    svg.appendChild(el("path", attrs));
  };
  path(water, false);
  path(rows.map((r) => r.flood_km2), true);

  for (let i = 0; i < rows.length; i += 1) {
    svg.appendChild(el("circle", {
      cx: x(i), cy: y(water[i]), r: 3, fill: "var(--channel)",
    }));
  }

  // A date label roughly every other month, and always the last one. The
  // last is chosen first and the run works backwards from it, because
  // forcing it on at the end put it on top of the label before it.
  const GAP = 92;
  const labels = [rows.length - 1];
  for (let i = rows.length - 2; i >= 0; i -= 1) {
    if (x(labels[labels.length - 1]) - x(i) >= GAP) labels.push(i);
  }
  labels.reverse();
  for (const i of labels) {
    svg.appendChild(el("text", {
      x: x(i), y: H - B + 26, "text-anchor": i === rows.length - 1 ? "end" : "middle",
      fill: "var(--muted)", "font-size": 14,
    }, dayLabel(rows[i].day)));
  }

  // Annotate the published anchor, not the raw minimum. The headline
  // quotes a median over several cycles - taking min() here instead put
  // two different "lowest" figures on one page.
  const anchorDay = data.lowest && data.lowest.day;
  const anchorAt = anchorDay ? rows.findIndex((r) => r.day === anchorDay) : -1;
  const lowAt = anchorAt >= 0 ? anchorAt : water.indexOf(Math.min(...water));
  const lastAt = rows.length - 1;
  for (const [index, key, anchor] of [[lowAt, "chartLow", "start"],
                                      [lastAt, "chartNow", "end"]]) {
    if (index < 0) continue;
    const cx = x(index), cy = y(water[index]);
    svg.appendChild(el("circle", {
      cx, cy, r: 7, fill: index === lastAt ? "var(--accent)" : "var(--white)",
      stroke: "var(--ink)", "stroke-width": 2,
    }));
    const dx = anchor === "end" ? -12 : 12;
    svg.appendChild(el("text", {
      x: cx + dx, y: cy - 14, "text-anchor": anchor,
      fill: "var(--ink)", "font-size": 14, "font-weight": index === lastAt ? 500 : 400,
    }, `${t[key]} ${num(Math.round(water[index]))}`));
  }

  const lo = Math.min(...water), hi = Math.max(...water);
  let gaps = 0;
  for (let i = 0; i < rows.length - 1; i += 1) if (gapAfter(i)) gaps += 1;
  document.getElementById("chartDesc").textContent = t.chartDesc(
    longDay(rows[0].day), longDay(rows[rows.length - 1].day),
    num(Math.round(data.lowest ? data.lowest.water_km2 : lo)),
    num(Math.round(data.highest ? data.highest.water_km2 : hi)), gaps);
  document.getElementById("keys").hidden = false;
}

function drawSkill(skill) {
  const t = T[lang];
  const body = document.getElementById("skillRows");
  body.textContent = "";
  const heads = [t.skillRecall, t.skillPrecision, t.skillIou, t.skillWas];

  // One row per stretch, because a single river-wide figure hides that the
  // method is near 0.9 in the gorge and near 0.5 below Corrientes, and
  // which end of that a given number came from is the reader's business.
  const line = (label, now, before, strong) => {
    const tr = document.createElement("tr");
    if (strong) tr.className = "now";
    const th = document.createElement("th");
    th.scope = "row";
    th.textContent = label;
    tr.appendChild(th);
    const cells = [now.recall, now.precision, now.iou, before && before.iou];
    cells.forEach((v, i) => {
      const td = document.createElement("td");
      td.dataset.label = heads[i];
      td.textContent = v === null || v === undefined ? "–" : num(v, 2);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  };

  for (const s of skill.stretches || []) {
    line(`${s.from_name} – ${s.to_name}`, s.now || {}, s.previous, false);
  }
  line(t.skillWhole, skill, skill.previous || {}, true);

  document.getElementById("skillLead").textContent = t.skillLead(
    skill.day ? longDay(skill.day) : (skill.measured_against || "Sentinel-2"),
    (skill.stretches || []).length);
}

function render(data) {
  const t = T[lang];
  // Every row here is one measurement over the dissolved union of the
  // corridors: a cycle that could not be measured in full is absent
  // rather than low.
  const rows = data.river || [];
  const latest = data.latest, low = data.lowest;

  // The whole-river figure is withheld rather than summed from the
  // stretches, which overlap. Say so instead of showing an empty page -
  // and say it in its own box, because a figure deliberately not
  // published is a different thing from data that failed to load.
  const withheld = document.getElementById("riverUnavailable");
  withheld.textContent = T[lang].riverUnavailable;
  withheld.hidden = !data.river_unavailable;
  document.getElementById("chartEmpty").hidden = rows.length > 0;

  if (latest) {
    // Every figure is labelled with the window it was measured over, not
    // just the day that window closes. The date on a cycle is a grid
    // boundary; the measurement spans the twelve days behind it.
    const from_ = windowStart(latest), to = latest.day;
    document.getElementById("area").textContent = num(Math.round(latest.water_km2));
    document.getElementById("areaCap").textContent = t.areaCap;
    document.getElementById("tileWindow").textContent =
      t.tileWindow(dayLabel(from_), dayLabel(to));
    document.getElementById("areaNote").textContent = low && low.day !== latest.day
      ? t.areaNote(longDay(from_), longDay(to),
                   num(Math.round(latest.water_km2 - low.water_km2)),
                   num(Math.round(low.water_km2)), anchorDays(low),
                   (low.over_cycles || []).length > 1)
      : t.areaNoteFlat(longDay(from_), longDay(to));

    // How old the measurement is, said plainly. The gauge pages carry an
    // age and this did not, so a figure up to a fortnight old sat in the
    // present tense beside readings from yesterday.
    document.getElementById("ageNote").textContent = t.ageNote(daysSince(to));

    const beyond = document.getElementById("floodNote");
    if (low && low.flood_km2 > 0 && low.day !== latest.day) {
      beyond.textContent = t.floodNote(
        num(Math.round(latest.flood_km2)), num(Math.round(low.flood_km2)),
        num(latest.flood_km2 / low.flood_km2, 1));
      beyond.hidden = false;
    } else {
      beyond.hidden = true;
    }

    // A total summed from overlapping corridors says so. Rows measured
    // over the union carry `stretches` as a list.
    const summed = document.getElementById("sumWarning");
    summed.textContent = t.sumWarning;
    summed.hidden = Array.isArray(latest.stretches);

    document.getElementById("passWindow").textContent =
      t.windowValue(dayLabel(from_), dayLabel(to));
    document.getElementById("reach").textContent = t.reachValue(
      num(Math.round(riverKm(data))),
      Array.isArray(latest.stretches) ? latest.stretches.length : latest.stretches);
    const rise = low
      ? `+${num(Math.round(((latest.water_km2 / low.water_km2) - 1) * 100))}%`
      : "–";
    document.getElementById("rise").textContent = rise;
    document.getElementById("riseTile").textContent = rise;
    document.getElementById("meta").hidden = false;
    if (low) {
      document.getElementById("lowTile").textContent = num(Math.round(low.water_km2));
      document.getElementById("lowCap").textContent = t.lowCap(anchorDays(low));
    }
  }

  drawChart(rows, data);
  if (data.skill) drawSkill(data.skill);
  if (film) describeFilm(film);
}

// The twelve days a cycle covers. Rows measured over the corridor union
// carry their own window_start; older rows carry only the closing date, so
// the window is reconstructed from it rather than left unsaid.
function windowStart(row) {
  if (row.window_start) return row.window_start;
  const end = new Date(row.day + "T12:00:00");
  end.setDate(end.getDate() - 11);
  return end.toISOString().slice(0, 10);
}

function daysSince(iso) {
  const then = new Date(iso + "T12:00:00"), now = new Date();
  return Math.max(0, Math.round((now - then) / 86400000));
}

// The anchor is a median over several cycles, so it is quoted as the span
// it was taken from rather than as one date that happened to be lowest.
function anchorDays(anchor) {
  const days = anchor.over_cycles || [anchor.day];
  return days.length === 1
    ? longDay(days[0])
    : `${dayLabel(days[0])} – ${dayLabel(days[days.length - 1])}`;
}

function riverKm(data) {
  if (typeof data.river_km === "number") return data.river_km;
  return (data.stretches || []).reduce((sum, s) => sum + (s.river_km || 0), 0);
}

// -- the film and the scrubber ----------------------------------------------

const loopImg = document.getElementById("loop");
const loopFrame = document.getElementById("loopFrame");
const loopToggle = document.getElementById("loopToggle");
const still = document.getElementById("still");
const scrub = document.getElementById("scrub");
let loopRunning = true;

function labelToggle() {
  const label = loopRunning ? T[lang].pauseLoop : T[lang].playLoop;
  loopToggle.textContent = label;
  loopToggle.setAttribute("aria-label", label);
}

function freezeLoop() {
  // A GIF cannot be paused, so the first frame is painted to a canvas and
  // the canvas is shown in its place.
  const w = loopImg.naturalWidth, h = loopImg.naturalHeight;
  if (w && h && still.hidden) {
    loopFrame.width = w;
    loopFrame.height = h;
    loopFrame.getContext("2d").drawImage(loopImg, 0, 0);
    loopFrame.hidden = false;
    loopImg.hidden = true;
  }
  loopRunning = false;
  loopToggle.classList.remove("playing");
  labelToggle();
}

function runLoop() {
  loopFrame.hidden = true;
  still.hidden = true;
  loopImg.hidden = false;
  loopRunning = true;
  loopToggle.classList.add("playing");
  labelToggle();
}

loopToggle.addEventListener("click", () => (loopRunning ? freezeLoop() : runLoop()));

function settleLoop() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) freezeLoop();
  else runLoop();
}
if (loopImg.complete) settleLoop();
else loopImg.addEventListener("load", settleLoop);

// The one thing a reader can do here: hold one window still. Each frame is
// shown with the whole-river figure published for that same window, read
// from the measurement, not from the label painted on the picture.
function frameRows() {
  return (film && film.frames) || [];
}

function figureFor(end) {
  const rows = (payload && payload.river) || [];
  const row = rows.find((r) => r.day === end);
  return row ? row.water_km2 : null;
}

function showFrame(index) {
  const frames = frameRows();
  const frame = frames[index];
  if (!frame) return;
  const t = T[lang];
  const when = t.windowValue(dayLabel(frame.start || windowStart({ day: frame.end })),
                             dayLabel(frame.end));
  const km = figureFor(frame.end);
  document.getElementById("scrubWhen").textContent = when;
  const fig = document.getElementById("scrubKm");
  fig.textContent = km === null ? t.scrubNone : num(Math.round(km));
  fig.classList.toggle("none", km === null);
  scrub.value = String(index);
  scrub.setAttribute("aria-valuetext",
    t.scrubValue(when, km === null ? null : num(Math.round(km))));
  return { frame, when };
}

scrub.addEventListener("input", () => {
  const shown = showFrame(Number(scrub.value));
  if (!shown) return;
  if (loopRunning) freezeLoop();
  if (!shown.frame.still) return;
  still.src = shown.frame.still;
  still.alt = T[lang].stillAlt(shown.when);
  still.hidden = false;
  loopImg.hidden = true;
  loopFrame.hidden = true;
});

function describeFilm(data) {
  const frames = data.frames || [];
  if (!frames.length) return;
  const t = T[lang];
  document.getElementById("loopCaption").textContent = t.loopCaption(
    num(Math.round(data.river_km || 0)), frames.length,
    longDay(frames[0].end), longDay(frames[frames.length - 1].end));
  document.getElementById("filmFrames").textContent = num(frames.length);
  document.getElementById("filmWindow").textContent = t.filmWindowValue(data.window_days || 12);
  document.getElementById("filmRiver").textContent = t.filmRiverValue(num(Math.round(data.river_km || 0)));
  document.getElementById("filmStretches").textContent = num((data.stretches || []).length);
  scrub.max = String(frames.length - 1);
  scrub.disabled = false;
  const at = still.hidden ? frames.length - 1 : Number(scrub.value);
  showFrame(at);
}

for (const b of document.querySelectorAll(".langs button")) {
  b.addEventListener("click", () => setLang(b.dataset.lang));
}

setLang(pickLang());

// Entrances: each part of a section rises once as it comes into view. The
// hidden state is set by the .js class only, so without script nothing is
// ever hidden.
(function motion() {
  const root = document.documentElement;
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add("ready")));
  const parts = document.querySelectorAll(".rise");
  if (!("IntersectionObserver" in window)) {
    parts.forEach((p) => p.classList.add("in"));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
  parts.forEach((p) => io.observe(p));
})();

fetch("data/river_film.json", { cache: "no-cache" })
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => { film = d; if (d) describeFilm(d); })
  .catch(() => { /* the caption falls back to the flat wording */ });

fetch("data/floodwater.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((data) => { payload = data; render(data); })
  .catch((err) => {
    const box = document.getElementById("error");
    box.textContent = "No se pudieron cargar los datos / could not load data: " + err.message;
    box.hidden = false;
  });
</script>
</body>
