    sourceGate: "Before anything is published, the data is tested: no duplicate days per gauge, no nulls where there cannot be any, values inside each gauge's physical range, and the main gauges present. If a test fails nothing is published and the last good data stays online, with its own date visible on the page.",

    pctHeading: "Why percentiles and not metres",
    pctBody: "Every gauge has its own zero. 5.70 m at Goya and 5.70 m at Puerto Iguazú are not the same thing or anything like it: they are not heights above a shared datum, they are heights on each port's own scale. Comparing metres between gauges means nothing.",
    pctBody2: "So almost everything here is expressed as a day-of-year percentile: where today's height falls within everything recorded for that same date at that same gauge. “Above the 95th percentile for late October” means the same thing at Corrientes as at Rosario. The long-record gauges — Corrientes, Goya, La Paz, Paraná, Diamante, Rosario — have between 120 and 143 years; the rest have considerably less, and their percentile is correspondingly less firm.",

    chainHeading: "The river chain, and the kilometres",
    chainBody: "Putting gauges in order along the river means knowing which is upstream of which, and how far apart. That comes from walking the HydroRIVERS network, but the automatic result is not used as it stands: six gauges had been snapped to side channels instead of the main stem, one of them 660 km from where it belongs. The chain is hand-corrected and frozen in the repository; when it is regenerated it is diffed against the stored version rather than replacing it.",
    chainBody2: "The kilometres are approximate. They come from simplified geometry and flat degree-to-kilometre factors. They are good enough to estimate speeds and order the river; they are not navigation distances.",

    lagHeading: "Crests and travel times",
    lagBody: "A flood takes days to move from one gauge to the next, and that delay is measured rather than assumed. The series is smoothed with a centred window — centred deliberately: an average that looks only backwards shifts peaks forward and would invent delays — then crests are detected and matched between neighbouring gauges. Separately, the two series are cross-correlated. Where the two methods agree the delay is credible; where they don't, the table says so.",
    colLeg: "Leg", colKm: "km", colDays: "delay", colSpread: "range", colN: "cases", colNote: "",
    lagLimits: "Two limits matter. The data is daily, so on short legs the measured delay says more about how often it is measured than about the river: San Lorenzo to Rosario is 21 km, which a crest covers in a few hours, but one reading a day can only record 0, 1 or 2 days. On those legs the delay is still useful for knowing when the water arrives; the speed in km per day is not, which is why speed is quoted over the whole run rather than per leg. And speed is not separated by wave size either, although a large flood is known to travel faster than a small one; a single median hides that.",
    noteResolution: "delay usable, speed not",
    noteDisagree: "the two methods disagree",
    noteFew: "few cases",
    noteOk: "",
    celerity: (kmd, km, days, legs) =>
      `Over ${km} km and ${legs} legs, the wave travels at about ${kmd} km per day: roughly ${days} days end to end. It is computed over the whole run precisely to sidestep the problem above, and it is an average over the whole record, not this flood.`,

    aheadHeading: "The projected arrivals",
    aheadBody: "This is the only thing on the site that looks forward, so it is built to say as little as possible. It takes the flood front \u2014 the furthest downstream gauge that has already passed its peak, with the river still rising below it \u2014 and adds the travel times measured over the record.",
    aheadAnchor: "It projects from the front rather than from further up, because every leg adds its own error: projecting Rosario from Corrientes when Goya has already crested throws away the better measurement. And if any leg between the front and a gauge has no confident travel time, that gauge gets no projection at all \u2014 better nothing than a total that quietly skipped a stretch of river.",
    aheadWindow: "The range is not a confidence interval and is not presented as one. It is what happens if every leg runs at its historical fast end, against every leg at its slow end. Quantiles do not add, so summing the per-leg 25th percentiles does not give the 25th percentile of the whole journey; it gives something wider and more pessimistic. Wider in the honest direction, and labelled for what it is.",
    aheadHeight: "And it says when, not how high. A crest's height at the next gauge depends on the channel it travels through and on whatever the tributaries in between contribute, and there is no routing model here to work that out. A level projected without one would be a hunch with a number on it.",
    skillLine: (inside, scored, pct, median, baseline, flat, from_) =>
      `Measured, not assumed: running the method over the record since ${from_} as it would have run on each day, the actual crest fell inside the published window ${inside} times out of ${scored} (${pct}%), with a median error of ${median} days. Without the travel times the median error would be ${baseline} days, so the method does add something, but an error of ${median} days on journeys of a few days to a fortnight is too large to treat as a date. There is also a floor: a Paraná crest stays within 10 cm of its peak for ${flat} days, so the exact day of the crest is not defined any finer either.`,
    officialHeading: "The official alert and evacuation levels",
    officialBody: "The alert and evacuation levels are not ours: INA publishes them in its daily report and they are transcribed here as they stand. Where a gauge has no published level the field is left empty and the gauge is shown without an alert line. Nothing is interpolated, estimated, or filled in from the gauge next door.",

    radarHeading: "Water measured by radar",
    radarBody: "Flooded area is measured with Sentinel-1, a radar that sees through cloud — which is exactly what the Litoral needs when it rains. Calm open water looks dark because it reflects the pulse away from the satellite; rough land sends it back. VV polarisation, a 50 m speckle filter, over a corridor 20 km either side of the channel.",
    radarCalib: "The threshold separating water from land is neither chosen by eye nor computed automatically: it is calibrated stretch by stretch against the permanent water the JRC maps independently, using the 2021 bajante — the lowest Paraná in 77 years — as the reference for “the river in its channel and nothing more”. The threshold does not transfer between stretches.",
    colStretch: "Stretch", colThreshold: "threshold", colBajante: "2021 bajante", colJrc: "JRC", colResidual: "diff.",
    radarGorge: "The two stretches above Posadas never calibrate. There the Paraná runs boxed into basalt, and although widening the search does find thresholds that match JRC — around -20 and -21 dB — they differ by 6.5 dB between neighbouring reaches. That is a threshold compensating for radar shadow against the valley walls, not one measuring water. Those two stretches are drawn on the map but publish no area, and are excluded from every total.",
    radarFilters: "Two filters discard passes. A pass covering less than 95% of the corridor leaves ground unobserved, and unobserved ground counts as zero water: it would read as the river shrinking. And a pass finding less than 70% of the permanent channel is also discarded — that happens when wind roughens the surface and water stops looking dark. The second filter came from a failing test, not from looking at maps: one pass reported 218 km² where the permanent channel alone is 556.",
    radarComposite: "The map animates 12-day composites; the charts use single passes. The satellite's swath is narrower than this run of river, so a single pass almost never covers all of it. A composite over a full repeat cycle always does. Each view says which of the two it is showing: a composite is a window, not an instant.",
    radarFloor: "And the limit underneath all of it: radar cannot see water under vegetation. Flooded forest sends the pulse back and counts as dry land. Every area published here is a floor, not a total — over the wooded islands and wetlands, well below the truth.",

    deltaHeading: "The Delta, and why almost everything stops there",
    deltaBody: "Below Villa Constitución the Paraná stops being a river and becomes a delta: it opens into branches across a belt of islands tens of kilometres wide, and the Río de la Plata starts to take over. Everything here was extended south to see what would survive. Almost nothing did, and what did not was measured rather than assumed.",
    deltaTide: "Where it stops being the Paraná: comparing each Delta gauge against Villa Constitución, the river still explains 96–98% of what happens at San Nicolás and Ramallo, 83–89% at San Pedro and Baradero, and 73% at Ibicuy. At Zárate, Campana and Escobar that falls to 8–27%, and at Tigre, San Fernando and Olivos to 1–2%. At those last three the day-to-day correlation is negative (−0.15 to −0.28): when the river rises, those gauges tend to move the other way, because wind and tide move them, not the Paraná.",
    deltaTopology: "Why the river line goes no further: the river network everything here is ordered by is a tree — each reach has exactly one reach below it. A delta does the opposite; one branch splits in two. The western branch past San Nicolás, Ramallo and San Pedro simply is not in that network: at San Nicolás's latitude the main line runs 46 km to the east. That is why those gauges were snapped to local creeks draining 2,000 km² where the Paraná carries 2,535,000, and why they are still marked as badly placed. The river's colour stops at Villa Constitución, the last gauge that can paint it.",
    deltaArea: "And the Delta's flooded area is not published. It calibrates well on low water — in 2021 it gives 277 km² against JRC's 302, an 8.2% residual — and falls apart on a flood: over six months of a record flood the series swings between 430 and 1,326 km² with no trend, and its correlation with the stage at Ibicuy is −0.39. The water falls as the river rises. The six calibrated stretches upstream run +0.43 to +0.72 on the same test. A negative correlation is not a weak measurement, it is a measurement of something else — tide state and wind on open water, averaged into a 12-day window. The Delta shows the radar picture and publishes no figure.",
    lineHeading: "The daily river line",
    lineBody: "The river's colour on the map is the day's percentile at each point, interpolated between the 22 gauges along the run. The interpolation runs along river distance, not straight across the map: two points 20 km apart on a meander are far closer by water than two points 20 km apart across the bend.",
    lineDam: "The line breaks at Yacyretá. Above the dam is a reservoir and below it a regulated river; they are hydraulically separate, and a smooth gradient across the wall would be plainly false while looking perfectly tidy.",
    lineExcluded: "Not every gauge may colour the river. Flow gauges measure something else. Gauges with no trustworthy position on the channel cannot anchor anything. And tide-affected Delta gauges rise with the Río de la Plata: painting the Paraná with their percentile would show a tide as though it were a flood wave.",

    driversHeading: "What's upstream",
    driversBody: "Three things that help explain where the water is coming from: what the dams upstream are releasing, the ENSO index — El Niño and La Niña shift the rainfall regime across the whole basin — and satellite-estimated rainfall over each sub-basin, from IMERG.",
    driversLimits: "None of it is a forecast, and satellite rainfall is not measured rainfall: it is an estimate with its own error, useful for comparing one sub-basin with another and one week with another, not for saying how many millimetres fell in a given place.",

    breakHeading: "When it stops working, and how you'd know",
    breakBody: "If INA stops publishing, the honest thing is to keep showing the last good reading with its date rather than take the site down. But on its own that would leave nobody any the wiser, so a separate check runs after publishing: if what is online has gone stale — the heights, the rainfall, the flooded area, or the daily river line — the automated run goes red even though the site looks perfect. Several of this project's failures were exactly that: all green, and the page wrong.",

    dataHeading: "The data, as CSV",
    dataBody: "The pages read JSON because a browser does. Anyone who wants to check the work, or use it in their own basin, wants columns. Asking a hydrologist to unpick nested JSON to get a stage series is a way of not really publishing it.",
    dataRiver: "— level and percentile for every gauge, day by day, over the last 180 days.",
    dataFlood: "— water area per stretch at each satellite pass. Uncalibrated stretches are absent: they publish no figure here either.",
    dataLags: "— travel time per leg, with the spread and how many floods it was measured over.",
    dataLicence: "The full record reaches 1884 and runs to 950,000 rows: that lives in the repository, not in a file a page links to. The underlying sources are INA, ESA, the JRC and NASA, each with its own licence; what is added here is the processing.",
    notHeading: "What this site does not do",
    notList: [
      "It does not forecast. There is no hydrological model behind it: the projected arrivals are travel times measured on past floods, published alongside their error.",
      "It does not say how high the river will get, only when the crest would arrive.",
      "It does not measure the Delta. It shows the radar picture below Villa Constitución but publishes no area and no river colour there: tide and wind dominate, and that was measured rather than assumed.",
      "It publishes no area for the two gorge stretches above Posadas.",
      "It does not separate wave speed by flood size, although speed is known to depend on it.",
      "It does not replace INA's official alert, which is the one to act on.",
    ],

    credits: "Sources: river heights and alert levels, INA (alerta.ina.gob.ar). Radar: Copernicus Sentinel-1 (ESA). Permanent water: JRC Global Surface Water. Rainfall: NASA IMERG. ENSO: NOAA. River network: HydroRIVERS. Boundaries: geoBoundaries (CC BY 4.0). Basemap: OpenStreetMap.",
    repoLink: "All the code and data, on GitHub →",
  },
};

let lang = stored();
let flooded = null, wave = null, track = null;

function stored() {
  try {
    const v = localStorage.getItem("crecida.lang");
    if (v === "es" || v === "en") return v;
  } catch (e) { /* ignore */ }
  return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
}

function fmt(value, places) {
  return value === null || value === undefined
    ? "—"
    : value.toLocaleString(T[lang].locale, {
        minimumFractionDigits: places, maximumFractionDigits: places,
      });
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("crecida.lang", next); } catch (e) { /* ignore */ }
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  for (const el of document.querySelectorAll("[data-t]")) {
    const v = t[el.dataset.t];
    if (typeof v === "string") el.textContent = v;
  }
  for (const el of document.querySelectorAll("[data-t-aria]")) {
    el.setAttribute("aria-label", t[el.dataset.tAria] || "");
  }
  for (const b of document.querySelectorAll(".langs button")) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  document.title = `${t.title} — ${lang === "es" ? "Crecida del Paraná" : "Paraná flood tracker"}`;
  renderNotList();
  renderCalibration();
  renderLegs();
  renderSkill();
}

function renderSkill() {
  const box = document.getElementById("aheadSkill");
  const s = (track || {}).skill || {};
  const flat = (s.crest_flatness || {}).median_days;
  box.textContent = (s.scored && flat)
    ? T[lang].skillLine(s.inside_window, s.scored, s.inside_window_pct,
                        s.median_error_days, s.baseline_median_error_days,
                        flat, (s.window || {}).from)
    : "";
  box.hidden = !box.textContent;
}

function renderNotList() {
  const ul = document.getElementById("notList");
  ul.replaceChildren(...T[lang].notList.map((text) => {
    const li = document.createElement("li");
    li.textContent = text;
    return li;
  }));
}

function renderCalibration() {
  const body = document.querySelector("#calib tbody");
  if (!flooded) return;
  const t = T[lang];
  body.replaceChildren(...flooded.stretches.map((s) => {
    const tr = document.createElement("tr");
    const residual = (s.baseline_km2 && s.permanent_water_km2)
      ? Math.abs(s.baseline_km2 - s.permanent_water_km2) / s.permanent_water_km2 * 100
      : null;
    if (s.calibrated === false) tr.className = "uncalibrated";
    const cells = [
      [`${s.from_name} – ${s.to_name}`, ""],
      [fmt(s.river_km, 0), "num"],
      [s.threshold_db === undefined ? "—" : `${fmt(s.threshold_db, 1)} dB`, "num"],
      [fmt(s.baseline_km2, 0), "num"],
      [fmt(s.permanent_water_km2, 0), "num"],
      [residual === null ? "—" : `${fmt(residual, 1)}%`, "num"],
    ];
    for (const [text, cls] of cells) {
      const td = document.createElement("td");
      td.textContent = text;
      if (cls) td.className = cls;
      tr.appendChild(td);
    }
    return tr;
  }));
}

function renderLegs() {
  const body = document.querySelector("#legs tbody");
  if (!wave) return;
  const t = T[lang];
  body.replaceChildren(...wave.legs.map((leg) => {
    const tr = document.createElement("tr");
    const note = !leg.agree ? t.noteDisagree
      : leg.n < 10 ? t.noteFew
      : leg.resolution_limited ? t.noteResolution
      : t.noteOk;
    const cells = [
      [`${leg.from_name} – ${leg.to_name}`, ""],
      [fmt(leg.km, 0), "num"],
      [fmt(leg.median_days, 1), "num"],
      [`${fmt(leg.p25_days, 1)}–${fmt(leg.p75_days, 1)}`, "num"],
      [fmt(leg.n, 0), "num"],
      [note, "note"],
    ];
    for (const [text, cls] of cells) {
      const td = document.createElement("td");
      td.textContent = text;
      if (cls) td.className = cls;
      tr.appendChild(td);
    }
    return tr;
  }));
  const c = wave.celerity;
  document.getElementById("celerityLine").textContent = c
    ? t.celerity(fmt(c.km_per_day, 0), fmt(c.total_km, 0), fmt(c.total_days, 0), c.legs_used)
    : "";
}

for (const b of document.querySelectorAll(".langs button")) {
  b.addEventListener("click", () => setLang(b.dataset.lang));
}

Promise.all([
  fetch("data/flooded.json").then((r) => r.ok ? r.json() : null).catch(() => null),
  fetch("data/wave.json").then((r) => r.ok ? r.json() : null).catch(() => null),
  fetch("data/track.json").then((r) => r.ok ? r.json() : null).catch(() => null),
]).then(([f, w, k]) => {
  flooded = f;
  wave = w;
  track = k;
  setLang(lang);
});

setLang(lang);
</script>
</body>
</html>
