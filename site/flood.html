<!doctype html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superficie, tramo por tramo · Crecida del Paraná</title>
<meta name="description" content="La superficie de agua medida por radar en cada tramo del Paraná, pasada por pasada, con el puntaje de validación de cada uno.">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#content" data-t="skipLink"></a>
<div class="wrap">

  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div class="langs" role="group" data-t-aria="langGroup">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <nav class="views" data-t-aria="viewsNav">
    <a href="index.html" aria-current="page" data-t="viewSpace"></a>
    <a href="map.html" data-t="viewMap"></a>
    <a href="gauges.html" data-t="viewToday"></a>
    <a href="method.html" data-t="viewMethod"></a>
  </nav>

  <main id="content" tabindex="-1">

  <p class="notice">
    <strong data-t="noticeStrong"></strong>
    <span data-t="noticeBody"></span>
    <a href="https://alerta.ina.gob.ar/" target="_blank" rel="noopener" data-t="officialLink"></a>
  </p>

  <div id="error" class="err" role="alert" hidden></div>

  <p class="pickrow">
    <label for="pick" data-t="pickLabel"></label>
    <select id="pick"></select>
  </p>

  <div class="headline lede" id="headline" hidden>
    <span class="big" id="area">–</span>
    <span class="unit" id="areaCap"></span>
    <p class="say" id="areaNote"></p>
    <dl class="facts" id="meta" hidden>
      <div><dt data-t="reachLabel"></dt><dd id="reach"></dd></div>
      <div><dt data-t="passLabel"></dt><dd id="passDay"></dd></div>
      <div><dt data-t="scoreLabel"></dt><dd id="score"></dd></div>
    </dl>
  </div>

  <div class="chartbox">
    <svg id="chart" class="floodchart" role="img" aria-labelledby="chartTitle chartDesc">
      <title id="chartTitle"></title>
      <desc id="chartDesc"></desc>
    </svg>
  </div>
  <div class="floodkeys" id="keys" hidden>
    <span><i class="water"></i><span data-t="keyWater"></span></span>
    <span><i class="flood"></i><span data-t="keyFlood"></span></span>
  </div>

  <p class="cap measure" style="color:var(--ink-soft);font-size:.9rem;margin-top:18px"
     id="skillLine"></p>
  <p class="cap measure" style="color:var(--ink-soft);font-size:.9rem" data-t="floorNote"></p>

  <section id="withheld" hidden>
    <h2 class="section major" data-t="withheldHeading"></h2>
    <ul class="limits measure" id="withheldList"></ul>
  </section>

  <section class="seealso" aria-labelledby="alsoHeading">
    <h2 class="section" id="alsoHeading" data-t="alsoHeading"></h2>
    <ul class="alsolist">
      <li><a href="index.html" data-t="alsoSpace"></a>
          <span data-t="alsoSpaceWhy"></span></li>
      <li><a href="gauges.html" data-t="alsoGauges"></a>
          <span data-t="alsoGaugesWhy"></span></li>
      <li><a href="method.html" data-t="alsoMethod"></a>
          <span data-t="alsoMethodWhy"></span></li>
    </ul>
  </section>

  <section class="provenance" aria-labelledby="provHeading">
    <h2 class="section" id="provHeading" data-t="provHeading"></h2>
    <dl>
      <div><dt data-t="provMeasuredLabel"></dt><dd data-t="provMeasured"></dd></div>
      <div><dt data-t="provCalculatedLabel"></dt><dd data-t="provCalculated"></dd></div>
      <div><dt data-t="provMissingLabel"></dt><dd data-t="provMissing"></dd></div>
    </dl>
  </section>
  </main>

  <footer>
    <p data-t="method"></p>
    <p data-t="credits"></p>
  </footer>
</div>

<script>
"use strict";

const T = {
  es: {
    htmlLang: "es", locale: "es-AR",
    title: "Superficie, tramo por tramo",
    subtitle: "Lo que mide el radar en cada tramo del río, pasada por pasada",
    langGroup: "Idioma", viewsNav: "Vistas",
    skipLink: "Saltar al contenido",
    viewSpace: "Desde el espacio", viewMap: "Mapa",
    viewToday: "El río hoy", viewMethod: "Método",
    noticeStrong: "No es un pronóstico oficial.",
    noticeBody: "Este sitio mide, no avisa. Para alertas y evacuaciones:",
    officialLink: "Sistema de Alerta Hidrológico del INA",

    pickLabel: "Tramo:",
    areaCap: "km² de agua en este tramo",
    areaNote: (day, extra, low, lowDay) =>
      `En la pasada cerrada el ${day}. Son ${extra} km² más que en la pasada más ` +
      `seca del registro (${low} km², ${lowDay}).`,
    areaNoteFlat: (day) => `En la pasada cerrada el ${day}.`,
    reachLabel: "Largo del tramo", passLabel: "Última pasada",
    scoreLabel: "IoU contra agua óptica",
    reachValue: (km) => `${km} km`,

    chartTitle: "Superficie de agua del tramo por pasada del satélite",
    chartDesc: (name, first, last, lo, hi) =>
      `Serie de superficie de agua en ${name}, entre ${first} y ${last}. ` +
      `El mínimo es ${lo} km² y el máximo ${hi} km².`,
    keyWater: "Toda el agua", keyFlood: "Sin el cauce permanente",
    axisKm2: "km²",

    skillLine: (iou, recall, precision) =>
      `Este tramo se midió contra agua óptica de Sentinel-2 en una fecha de ` +
      `crecida: encontró el ${recall}% del agua que el óptico ve, y el ${precision}% ` +
      `de lo que llamó agua lo era. IoU ${iou}.`,
    floorNote: "El radar no ve el agua bajo los árboles, así que toda cifra acá es un piso y no un total. Cada punto es un compuesto de doce días, no un instante.",

    withheldHeading: "Tramos que no publican cifra",
    withheldItem: (name, why) => `${name}: ${why}.`,
    whyUnscored: "nunca se pudo medir contra agua óptica, así que no se sabe si la máscara anda ahí",
    whyLow: "se midió y no llegó al piso de 0,45",

    alsoHeading: "Más",
    alsoSpace: "El río entero", alsoSpaceWhy: "la suma de estos tramos, y el año completo en una animación.",
    alsoGauges: "El río hoy", alsoGaugesWhy: "la altura medida en la estación de cada punta de este tramo.",
    alsoMethod: "Método y límites", alsoMethodWhy: "cómo se mide el agua, y la tabla de validación completa.",

    provHeading: "De dónde sale cada número",
    provMeasuredLabel: "Medido", provCalculatedLabel: "Calculado acá", provMissingLabel: "Sin dato",
    provMeasured: "La retrodispersión del radar Sentinel-1 de la ESA, y el agua óptica de Sentinel-2 contra la que se validó.",
    provCalculated: "La superficie de agua por tramo y por pasada, y el puntaje de cada tramo.",
    provMissing: "Los tramos de abajo, que están medidos y no publicados.",

    method: "Sentinel-1 GRD (VH), compuestos de 12 días, 60 m. Validado contra Sentinel-2 MNDWI. Altura sobre el drenaje: MERIT Hydro. Agua permanente: JRC Global Surface Water.",
    credits: "Datos de la ESA (Copernicus), el JRC y el INA. Código abierto.",
  },
  en: {
    htmlLang: "en", locale: "en-GB",
    title: "Surface, stretch by stretch",
    subtitle: "What the radar measures on each reach of the river, pass by pass",
    langGroup: "Language", viewsNav: "Views",
    skipLink: "Skip to content",
    viewSpace: "From space", viewMap: "Map",
    viewToday: "The river today", viewMethod: "Method",
    noticeStrong: "This is not an official forecast.",
    noticeBody: "This site measures; it does not warn. For alerts and evacuations:",
    officialLink: "INA's hydrological alert system",

    pickLabel: "Stretch:",
    areaCap: "km² of water on this stretch",
    areaNote: (day, extra, low, lowDay) =>
      `In the pass closed on ${day}. That is ${extra} km² more than the driest ` +
      `pass on the record (${low} km², ${lowDay}).`,
    areaNoteFlat: (day) => `In the pass closed on ${day}.`,
    reachLabel: "Length of reach", passLabel: "Last pass",
    scoreLabel: "IoU against optical water",
    reachValue: (km) => `${km} km`,

    chartTitle: "Water surface of the stretch by satellite pass",
    chartDesc: (name, first, last, lo, hi) =>
      `Water surface on ${name}, from ${first} to ${last}. The lowest pass is ` +
      `${lo} km² and the highest ${hi} km².`,
    keyWater: "All water", keyFlood: "Without the permanent channel",
    axisKm2: "km²",

    skillLine: (iou, recall, precision) =>
      `This stretch was scored against Sentinel-2 optical water on a flood date: ` +
      `it found ${recall}% of the water optical sees, and ${precision}% of what it ` +
      `called water was water. IoU ${iou}.`,
    floorNote: "Radar does not see water under trees, so every figure here is a floor and not a total. Each point is a twelve-day composite, not an instant.",

    withheldHeading: "Stretches that publish no figure",
    withheldItem: (name, why) => `${name}: ${why}.`,
    whyUnscored: "never scored against optical water, so whether the mask works there is unknown",
    whyLow: "scored, and did not clear the floor of 0.45",

    alsoHeading: "More",
    alsoSpace: "The whole river", alsoSpaceWhy: "the sum of these stretches, and the full year as an animation.",
    alsoGauges: "The river today", alsoGaugesWhy: "the stage measured at the gauge on each end of this reach.",
    alsoMethod: "Method and limits", alsoMethodWhy: "how the water is measured, and the full validation table.",

    provHeading: "Where each number comes from",
    provMeasuredLabel: "Measured", provCalculatedLabel: "Worked out here", provMissingLabel: "No data",
    provMeasured: "Backscatter from ESA's Sentinel-1 radar, and the Sentinel-2 optical water it was validated against.",
    provCalculated: "The water surface per stretch and per pass, and each stretch's score.",
    provMissing: "The stretches below, which are measured but not published.",

    method: "Sentinel-1 GRD (VH), 12-day composites, 60 m. Validated against Sentinel-2 MNDWI. Height above drainage: MERIT Hydro. Permanent water: JRC Global Surface Water.",
    credits: "Data from ESA (Copernicus), the JRC and INA. Open source.",
  },
};

const SVG = "http://www.w3.org/2000/svg";
// The stretch the page opens on. A key, not a position: the corridors are
// ordered upstream first, and when the run was extended north to the
// Brazil frontier, position zero silently became a gorge reach.
const DEFAULT_KEY = "corrientes_goya";

let lang = "es";
let payload = null;
let chosen = DEFAULT_KEY;

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem("crecida.lang"); } catch (e) { /* private mode */ }
  if (saved === "es" || saved === "en") return saved;
  return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("crecida.lang", next); } catch (e) { /* ignore */ }
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  for (const el of document.querySelectorAll("[data-t]")) {
    const v = t[el.dataset.t];
    if (typeof v === "string") el.textContent = v;
  }
  for (const el of document.querySelectorAll("[data-t-aria]")) {
    el.setAttribute("aria-label", t[el.dataset.tAria] || "");
  }
  for (const b of document.querySelectorAll(".langs button")) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  document.getElementById("chartTitle").textContent = t.chartTitle;
  if (payload) render(payload);
}

function el(name, attrs, text) {
  const n = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}

function niceStep(raw) {
  const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const multiple of [1, 2, 2.5, 5, 10]) {
    if (magnitude * multiple >= raw) return magnitude * multiple;
  }
  return magnitude * 10;
}

function num(v, digits) {
  return new Intl.NumberFormat(T[lang].locale, {
    minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0,
  }).format(v);
}

function dayLabel(iso) {
  return new Intl.DateTimeFormat(T[lang].locale, { day: "numeric", month: "short" })
    .format(new Date(iso + "T12:00:00"));
}

function longDay(iso) {
  return new Intl.DateTimeFormat(T[lang].locale, {
    day: "numeric", month: "long", year: "numeric",
  }).format(new Date(iso + "T12:00:00"));
}

function label(stretch) {
  return `${stretch.from_name} – ${stretch.to_name}`;
}

function drawChart(stretch) {
  const t = T[lang];
  const svg = document.getElementById("chart");
  // Keep everything up to and including <desc>, which aria-labelledby
  // points at, and drop the drawing below it. Counting child nodes instead
  // counts the whitespace between tags and deletes the <desc>.
  const keep = document.getElementById("chartDesc");
  while (svg.lastChild && svg.lastChild !== keep) svg.removeChild(svg.lastChild);

  const days = stretch.days || [];
  const water = stretch.water_km2 || [];
  const flood = stretch.flood_km2 || [];
  if (days.length < 2) return;

  const W = 760, H = 310, L = 58, R = 16, TOP = 16, B = 44;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const plotW = W - L - R, plotH = H - TOP - B;
  const top = Math.max(...water) * 1.08;
  const x = (i) => L + (i * plotW) / (days.length - 1);
  const y = (v) => TOP + plotH - (v / top) * plotH;

  // Round gridlines, as on the front page. Quartering the data maximum
  // gave 457 / 914 / 1,370 / 1,827 - no reader marks a river at 914.
  const step = niceStep(top / 4);
  for (let value = 0; value <= top; value += step) {
    svg.appendChild(el("line", {
      x1: L, x2: W - R, y1: y(value), y2: y(value),
      stroke: "var(--line)", "stroke-width": 1,
    }));
    svg.appendChild(el("text", {
      x: L - 8, y: y(value) + 4, "text-anchor": "end",
      fill: "var(--ink-faint)", "font-size": 11,
    }, num(value)));
  }
  svg.appendChild(el("text", {
    x: L + 4, y: TOP + 10, "text-anchor": "start",
    fill: "var(--ink-faint)", "font-size": 11,
  }, t.axisKm2));

  const path = (values, dashed) => {
    const points = values
      .map((v, i) => (v === null || v === undefined ? null : `${x(i).toFixed(1)} ${y(v).toFixed(1)}`))
      .filter(Boolean);
    if (points.length < 2) return;
    const attrs = {
      d: points.map((p, i) => `${i ? "L" : "M"}${p}`).join(" "),
      fill: "none", stroke: dashed ? "var(--evac)" : "var(--accent)",
      "stroke-width": dashed ? 2 : 2.6, "stroke-linejoin": "round",
    };
    if (dashed) attrs["stroke-dasharray"] = "5 4";
    svg.appendChild(el("path", attrs));
  };
  path(water, false);
  path(flood, true);

  for (let i = 0; i < days.length; i += 1) {
    svg.appendChild(el("circle", {
      cx: x(i), cy: y(water[i]), r: 2.6, fill: "var(--accent)",
    }));
  }

  const GAP = 76;
  const marks = [days.length - 1];
  for (let i = days.length - 2; i >= 0; i -= 1) {
    if (x(marks[marks.length - 1]) - x(i) >= GAP) marks.push(i);
  }
  marks.reverse();
  for (const i of marks) {
    svg.appendChild(el("text", {
      x: x(i), y: H - B + 20, "text-anchor": "middle",
      fill: "var(--ink-faint)", "font-size": 11,
    }, dayLabel(days[i])));
  }

  const lo = Math.min(...water), hi = Math.max(...water);
  document.getElementById("chartDesc").textContent = t.chartDesc(
    label(stretch), longDay(days[0]), longDay(days[days.length - 1]),
    num(lo), num(hi));
  document.getElementById("keys").hidden = false;
}

function fillPicker(stretches) {
  const pick = document.getElementById("pick");
  pick.replaceChildren(...stretches.map((s) => {
    const option = document.createElement("option");
    option.value = s.key;
    option.textContent = label(s);
    option.selected = s.key === chosen;
    return option;
  }));
}

function drawWithheld(rows) {
  const t = T[lang];
  const list = document.getElementById("withheldList");
  list.replaceChildren(...rows.map((s) => {
    const li = document.createElement("li");
    const why = s.iou === undefined || s.iou === null ? t.whyUnscored : t.whyLow;
    li.textContent = t.withheldItem(label(s), why);
    return li;
  }));
  document.getElementById("withheld").hidden = rows.length === 0;
}

function render(data) {
  const t = T[lang];
  const stretches = data.stretches || [];
  if (!stretches.length) return;
  fillPicker(stretches);

  const stretch = stretches.find((s) => s.key === chosen) || stretches[0];
  chosen = stretch.key;

  const days = stretch.days || [];
  const water = stretch.water_km2 || [];
  if (days.length) {
    let lowAt = 0;
    for (let i = 1; i < water.length; i += 1) if (water[i] < water[lowAt]) lowAt = i;
    const last = water.length - 1;
    document.getElementById("area").textContent = num(Math.round(water[last]));
    document.getElementById("areaCap").textContent = t.areaCap;
    document.getElementById("areaNote").textContent = lowAt === last
      ? t.areaNoteFlat(longDay(days[last]))
      : t.areaNote(longDay(days[last]), num(Math.round(water[last] - water[lowAt])),
                   num(Math.round(water[lowAt])), longDay(days[lowAt]));
    document.getElementById("headline").hidden = false;

    document.getElementById("reach").textContent =
      t.reachValue(num(Math.round(stretch.river_km || 0)));
    document.getElementById("passDay").textContent = longDay(days[last]);
    document.getElementById("score").textContent =
      stretch.iou === undefined ? "–" : num(stretch.iou, 2);
    document.getElementById("meta").hidden = false;
  }

  document.getElementById("skillLine").textContent = stretch.iou === undefined ? ""
    : t.skillLine(num(stretch.iou, 2), num(Math.round(stretch.recall * 100)),
                  num(Math.round(stretch.precision * 100)));

  drawChart(stretch);
  drawWithheld(data.withheld || []);
}

document.getElementById("pick").addEventListener("change", (event) => {
  chosen = event.target.value;
  if (payload) render(payload);
});

for (const b of document.querySelectorAll(".langs button")) {
  b.addEventListener("click", () => setLang(b.dataset.lang));
}

setLang(pickLang());

fetch("data/floodwater.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((data) => { payload = data; render(data); })
  .catch((err) => {
    const box = document.getElementById("error");
    box.textContent = "No se pudieron cargar los datos / could not load data: " + err.message;
    box.hidden = false;
  });
</script>
</body>
</html>
