      `Datos al ${when}` + (stale > 3 ? `, hace ${stale} días.` : "."),
    printedHeading: "Caudales que el INA publica pero no sirve por API",
    printedNote: "Estos valores salen del reporte diario del INA en PDF. Hay el número de hoy y nada de historia, así que no se los puede comparar con lo normal de la estación.",
    ensoNote: (season, year) => `Índice Niño Oceánico de la NOAA, trimestre ${season} ${year}. Es contexto de cuenca: explica por qué toda la cuenca está húmeda esta temporada, no el pico de una crecida en particular.`,
    phases: {

    langGroup: "Language",

      neutral: "Neutral",
      la_nina_weak: "Weak La Niña",
      la_nina_moderate: "Moderate La Niña",
      la_nina_strong: "Strong La Niña",
      la_nina_very_strong: "Very strong La Niña",
      unknown: "No data",
    },
    inSevenDays: "in 7 days",
    noReference: "no historical reference",
    alertShort: "Alert", evacShort: "Evac.",
    method: "Daily flows from INA's a5 API. Where INA has no historical series in the API, the day's value is taken from the daily PDF report and marked as such. Each station's reference curves are built from its own record, 20 to 143 years depending on the station.",

let lang = "es";
let payload = null;
const SVG = "http://www.w3.org/2000/svg";

function fmt(value, digits) {
  if (value === null || value === undefined) return "–";
  return new Intl.NumberFormat(T[lang].locale, {
    minimumFractionDigits: digits, maximumFractionDigits: digits,
  }).format(value);
}

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem("crecida.lang"); } catch (e) { /* private mode */ }
  if (saved === "es" || saved === "en") return saved;
  return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("crecida.lang", next); } catch (e) { /* ignore */ }
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  for (const el of document.querySelectorAll("[data-t]")) {
    const value = t[el.dataset.t];
    if (typeof value === "string") el.textContent = value;
  }
  for (const el of document.querySelectorAll("[data-t-aria]")) {
    el.setAttribute("aria-label", t[el.dataset.tAria] || "");
  }
  for (const b of document.querySelectorAll(".langs button")) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  if (payload) render(payload);
}

function el(name, attrs, text) {
  const node = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

function dayLabel(iso) {
  return new Intl.DateTimeFormat(T[lang].locale, { day: "numeric", month: "short" })
    .format(new Date(iso + "T12:00:00"));
}

function sparkline(gauge) {
  const W = 300, H = 48, PAD = 4;
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "spark");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img");

  const values = gauge.values;
  if (!values.length) return svg;
  const lines = [gauge.alert, gauge.evacuation].filter((v) => v !== null && v !== undefined);
  const lo = Math.min(...values, ...lines);
  const hi = Math.max(...values, ...lines);
  const span = Math.max(hi - lo, 1e-6);
  const x = (i) => PAD + (i / Math.max(values.length - 1, 1)) * (W - 2 * PAD);
  const y = (v) => H - PAD - ((v - lo) / span) * (H - 2 * PAD);

  const points = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  svg.appendChild(el("path", {
    class: "area",
    d: `M${x(0).toFixed(1)},${(H - PAD).toFixed(1)} L` + points.join(" L") +
       ` L${x(values.length - 1).toFixed(1)},${(H - PAD).toFixed(1)} Z`,
  }));
  svg.appendChild(el("path", { class: "line", d: "M" + points.join(" L") }));

  for (const [value, cls] of [[gauge.alert, "alert"], [gauge.evacuation, "evac"]]) {
    if (value === null || value === undefined) continue;
    svg.appendChild(el("line", {
      class: "thr " + cls, x1: PAD, x2: W - PAD, y1: y(value), y2: y(value),
    }));
  }
  svg.appendChild(el("title", {},
    `${gauge.name}: ${dayLabel(gauge.days[0])} – ${dayLabel(gauge.days[gauge.days.length - 1])}`));
  return svg;
}

function driverCard(gauge) {
  const t = T[lang];
  const card = document.createElement("div");
  card.className = "driver";

  const h = document.createElement("h3");
  h.textContent = gauge.name;
  card.appendChild(h);
  const row = document.createElement("div");
  row.className = "row";
  const val = document.createElement("span");
  val.className = "val";
  val.textContent = fmt(gauge.latest.value, gauge.unit === "m3/s" ? 0 : 2);
  const unit = document.createElement("span");
  unit.className = "u";
  unit.textContent = gauge.unit === "m3/s" ? "m³/s" : "m";
  val.appendChild(unit);
  row.appendChild(val);

  const right = document.createElement("span");
  const pct = document.createElement("span");
  pct.className = "pct";
  if (gauge.latest.percentile === null) {
    pct.textContent = t.noReference;
    pct.style.color = "var(--unknown)";
  } else {
    pct.textContent = "p" + fmt(gauge.latest.percentile, 0);
    pct.style.color = gauge.latest.percentile >= 90 ? "var(--evac)"
      : gauge.latest.percentile >= 75 ? "var(--alert)" : "var(--ink-soft)";
  }
  right.appendChild(pct);
  row.appendChild(right);
  card.appendChild(row);

  if (gauge.change_7d !== null && gauge.change_7d !== undefined) {
    const d7 = document.createElement("div");
    d7.className = "d7 " + (gauge.change_7d > 0 ? "up" : gauge.change_7d < 0 ? "down" : "");
    const sign = gauge.change_7d > 0 ? "+" : gauge.change_7d < 0 ? "−" : "±";
    d7.textContent = `${sign}${fmt(Math.abs(gauge.change_7d), 0)} ${t.inSevenDays}`;
    card.appendChild(d7);
  }

  card.appendChild(sparkline(gauge));
  return card;
}

// ENSO moved off this page. A quarterly index explains why a whole basin
// is wet this season; it says nothing about what the river is doing this
// week, and sitting beside gauge readings it read as though it did. The
// reasoning is on the method page and the numbers are in the data files.
function renderEnso(enso) {
  if (!document.getElementById("ensoVal")) return;
  const t = T[lang];
  if (!enso) return;
  const box = document.getElementById("enso");
  const value = document.getElementById("ensoVal");
  value.textContent = (enso.anomaly > 0 ? "+" : "") + fmt(enso.anomaly, 2);
  value.className = "phase " + (enso.anomaly >= 0.5 ? "warm" : enso.anomaly <= -0.5 ? "cool" : "");
  document.getElementById("ensoPhase").textContent =
    t.phases[enso.phase] || t.phases.unknown;
  document.getElementById("ensoNote").textContent = t.ensoNote(enso.season, enso.year);

  const bars = document.getElementById("ensoBars");
  bars.replaceChildren();
  const recent = enso.recent || [];
  const peak = Math.max(1, ...recent.map((r) => Math.abs(r.anomaly)));
  for (const reading of recent) {
    const bar = document.createElement("i");
    const share = Math.abs(reading.anomaly) / peak;
    bar.style.height = Math.max(3, share * 50) + "px";
    if (reading.anomaly >= 1.5) bar.className = "hot";
    else if (reading.anomaly >= 0.5) bar.className = "warm";
    else if (reading.anomaly <= -0.5) bar.className = "cool";
    bar.title = `${reading.season} ${reading.year}: ${reading.anomaly > 0 ? "+" : ""}${fmt(reading.anomaly, 2)}`;
    bars.appendChild(bar);
  }
  if (recent.length) {
    document.getElementById("ensoFrom").textContent =
      `${recent[0].season} ${recent[0].year}`;
    document.getElementById("ensoTo").textContent =
      `${recent[recent.length - 1].season} ${recent[recent.length - 1].year}`;
  }
  box.hidden = false;
}

function renderRain(rain) {
  const t = T[lang];
  const box = document.getElementById("rain");
  const note = document.getElementById("rainNote");
  box.replaceChildren();
  note.textContent = "";
  if (!rain || !rain.basins || !rain.basins.length) return;

  for (const basin of rain.basins) {
    const card = document.createElement("div");
    card.className = "rainbox";

    const h = document.createElement("h3");
    h.textContent = t.rainBasins[basin.key] || basin.key;
    card.appendChild(h);

    const area = document.createElement("p");
    area.className = "area";
    area.textContent = t.rainArea(fmt(basin.area_km2, 0));
    card.appendChild(area);

    const tot = document.createElement("div");
    tot.className = "tot";
    tot.textContent = fmt(basin.recent_mm, 0);
    const u = document.createElement("span");
    u.className = "u";
    u.textContent = "mm " + t.rainLast(basin.recent_days);
    tot.appendChild(u);
    card.appendChild(tot);

    if (basin.wettest_day) {
      const peak = document.createElement("div");
      peak.className = "peak";
      peak.textContent = t.rainPeak(fmt(basin.wettest_day.mm, 0),
                                    dayLabel(basin.wettest_day.day));
      card.appendChild(peak);
    }

    // Daily bars. The scale is per basin: the Iguazu peaks near 90 mm and
    // the Alto Parana near 24, and one shared axis would flatten the
    // smaller basin into nothing.
    const W = 300, H = 56;
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("class", "rainbars");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img");
    const values = basin.mm.map((v) => (v === null ? 0 : v));
    const peakValue = Math.max(1, ...values);
    const barW = W / values.length;
    values.forEach((value, i) => {
      const h = Math.max(value > 0 ? 1 : 0, (value / peakValue) * (H - 2));
      const rect = el("rect", {
        x: (i * barW).toFixed(2), y: (H - h).toFixed(2),
        width: Math.max(barW - 0.3, 0.6).toFixed(2), height: h.toFixed(2),
      });
      if (value >= peakValue * 0.6) rect.setAttribute("class", "big");
      rect.appendChild(el("title", {}, `${dayLabel(basin.days[i])}: ${fmt(value, 1)} mm`));
      svg.appendChild(rect);
    });
    card.appendChild(svg);
    box.appendChild(card);
  }

  note.textContent = t.rainNote(
    rain.source || "IMERG", dayLabel(rain.window.end), rain.stale_days || 0);
  if ((rain.stale_days || 0) > 3) note.classList.add("stalewarn");
  else note.classList.remove("stalewarn");
}

function renderPrinted(rows, reportDate) {
  const t = T[lang];
  const box = document.getElementById("printed");
  box.replaceChildren();
  if (!rows || !rows.length) return;
  const list = document.createElement("ul");
  for (const row of rows) {
    const li = document.createElement("li");
    const left = document.createElement("span");
    left.textContent = row.station + (reportDate ? ` · ${dayLabel(reportDate)}` : "");
    const right = document.createElement("span");
    right.className = "v";
    right.textContent = `${fmt(row.value, 0)} ${row.unit === "m3/s" ? "m³/s" : "m"}`;
    li.append(left, right);
    list.appendChild(li);
  }
  box.appendChild(list);
}

function render(data) {
  const t = T[lang];
  // The window spans a year, so the year has to be in the label: without
  // it "29 oct - 29 oct" reads as a single day.
  const spanFmt = new Intl.DateTimeFormat(t.locale, {
    day: "numeric", month: "short", year: "numeric",
  });
  document.getElementById("windowText").textContent =
    `${spanFmt.format(new Date(data.window.start + "T12:00:00"))} – ` +
    `${spanFmt.format(new Date(data.window.end + "T12:00:00"))}`;
  document.getElementById("genAt").textContent =
    new Intl.DateTimeFormat(t.locale, {
      day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
    }).format(new Date(data.generated_at));
  document.getElementById("meta").hidden = false;

  renderEnso(data.enso);
  document.getElementById("drivers").replaceChildren(
    ...(data.gauges || []).map(driverCard));
  renderRain(data.rainfall);
  renderPrinted(data.report_only, data.report_date);
}

for (const b of document.querySelectorAll(".langs button")) {
  b.addEventListener("click", () => setLang(b.dataset.lang));
}

setLang(pickLang());

fetch("data/drivers.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((data) => { payload = data; render(data); })
  .catch((err) => {
    const box = document.getElementById("error");
    box.textContent = "No se pudieron cargar los datos / could not load data: " + err.message;
    box.hidden = false;
  });
</script>
</body>
</html>
