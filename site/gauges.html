    evacShort: "Evac.",
    inDays: (n) => (n === 1 ? "in 1 day" : "in " + n + " days"),
    flagRegulated: "dam-regulated",
    flagTide: "tide-affected",

const BRANCH_KEY = {
  palmas: "branchPalmas",
  guazu: "branchGuazu",
  ibicuy: "branchIbicuy",
  victoria: "branchVictoria",
  estuary: "branchEstuary",
};

let lang = "es";
let payload = null;

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem("crecida.lang"); } catch (e) { /* private mode */ }
  if (saved === "es" || saved === "en") return saved;
  return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("crecida.lang", next); } catch (e) { /* ignore */ }
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  for (const el of document.querySelectorAll("[data-t]")) {
    const value = t[el.dataset.t];
    if (typeof value === "string") el.textContent = value;
  }
  for (const el of document.querySelectorAll("[data-t-aria]")) {
    el.setAttribute("aria-label", t[el.dataset.tAria] || "");
  }
  for (const b of document.querySelectorAll(".langs button")) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  if (payload) render(payload);
}

function whole(value) {
  return new Intl.NumberFormat(T[lang].locale, {
    maximumFractionDigits: 0,
  }).format(value);
}

function num(value, unit) {
  if (value === null || value === undefined) return null;
  const digits = unit === "m3/s" ? 0 : 2;
  return new Intl.NumberFormat(T[lang].locale, {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits,
  }).format(value);
}

function signed(value, unit) {
  const text = num(Math.abs(value), unit);
  const sign = value > 0 ? "+" : value < 0 ? "−" : "±";
  return sign + text;
}

function shortDate(iso) {
  if (!iso) return "—";
  return new Intl.DateTimeFormat(T[lang].locale, {
    day: "numeric", month: "short",
  }).format(new Date(iso + "T12:00:00"));
}

function longDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T12:00:00");
  return new Intl.DateTimeFormat(T[lang].locale, {
    day: "numeric", month: "long", year: "numeric",
  }).format(d);
}

function shortDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return new Intl.DateTimeFormat(T[lang].locale, {
    day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
  }).format(d);
}

function returnTag(g) {
  if (!g.return_period) return null;
  const el = document.createElement("span");
  el.className = "tag rare" + (g.return_period >= 10 ? " high" : "");
  el.textContent = T[lang].returnPeriod(Math.round(g.return_period));
  if (g.record_max) {
    el.title = T[lang].returnPeriodTitle(
      Math.round(g.return_period), num(g.record_max), g.record_max_year);
  }
  return el;
}

function tag(text) {
  const span = document.createElement("span");
  span.className = "tag";
  span.textContent = text;
  return span;
}

function gaugeItem(g) {
  const t = T[lang];
  const li = document.createElement("li");
  li.className = "gauge";
  li.dataset.status = g.status;

  const left = document.createElement("div");
  const name = document.createElement("p");
  name.className = "name";
  name.textContent = g.name;
  left.appendChild(name);

  const tags = document.createElement("div");
  tags.className = "tags";
  const branchKey = BRANCH_KEY[g.branch];
  if (branchKey) tags.appendChild(tag(t[branchKey]));
  if (g.flags.includes("regulated")) tags.appendChild(tag(t.flagRegulated));
  if (g.flags.includes("tide_affected")) tags.appendChild(tag(t.flagTide));
  const rare = returnTag(g);
  if (rare) tags.appendChild(rare);
  if (tags.childElementCount) left.appendChild(tags);

  const status = document.createElement("div");
  status.className = "status";
  status.textContent =
    g.status === "evacuation" ? t.statusEvacuation
    : g.status === "alert" ? t.statusAlert
    : g.status === "below" ? t.statusBelow
    : t.statusUnknown;
  left.appendChild(status);
  li.appendChild(left);

  const right = document.createElement("div");
  right.className = "reading";
  if (g.value === null) {
    const none = document.createElement("div");
    none.className = "nodata";
    none.textContent = t.noData;
    right.appendChild(none);
  } else {
    const level = document.createElement("div");
    level.className = "level";
    level.textContent = num(g.value, g.unit);
    const unit = document.createElement("span");
    unit.className = "unit";
    unit.textContent = g.unit === "m3/s" ? "m³/s" : "m";
    level.appendChild(unit);
    right.appendChild(level);

    if (g.change !== null) {
      const change = document.createElement("div");
      change.className = "change " + (g.change > 0 ? "up" : g.change < 0 ? "down" : "");
      const days = g.change_days && g.change_days !== 1 ? " " + t.inDays(g.change_days) : "";
      change.textContent = signed(g.change, g.unit) + days;
      right.appendChild(change);
    }
  }
  li.appendChild(right);

  // The bar is drawn only when there is something official to draw it
  // against. An invented scale would imply a threshold that does not exist.
  if (g.value !== null && (g.alert !== null || g.evacuation !== null)) {
    const lines = [g.alert, g.evacuation].filter((v) => v !== null);
    const top = Math.max(g.value, ...lines) * 1.12;
    const bar = document.createElement("div");
    bar.className = "bar";

    const track = document.createElement("div");
    track.className = "track";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = Math.max(0, Math.min(100, (g.value / top) * 100)) + "%";
    track.appendChild(fill);
    for (const [value, cls] of [[g.alert, "a"], [g.evacuation, "e"]]) {
      if (value === null) continue;
      const tick = document.createElement("div");
      tick.className = "tick " + cls;
      tick.style.left = (value / top) * 100 + "%";
      track.appendChild(tick);
    }
    bar.appendChild(track);

    const scale = document.createElement("div");
    scale.className = "scale";
    const a = document.createElement("span");
    a.textContent = g.alert === null ? "" : t.alertShort + " " + num(g.alert, g.unit);
    const e = document.createElement("span");
    e.textContent = g.evacuation === null ? "" : t.evacShort + " " + num(g.evacuation, g.unit);
    scale.append(a, e);
    bar.appendChild(scale);
    li.appendChild(bar);
  }

  return li;
}

// The lead. A reader arrives asking whether the river is behaving, not
// wanting a table of thirty-seven readings, and every part of the sentence
// carries the number it came from so the claim can be checked rather than
// taken.
function renderVerdict(v) {
  const t = T[lang];
  // This page formats with longDate and num; the shorter helpers the wave
  // and map pages use do not exist here.
  const day = (iso) => shortDate(iso);
  const ratio = (x) => new Intl.NumberFormat(T[lang].locale, {
    minimumFractionDigits: 1, maximumFractionDigits: 1,
  }).format(x);
  const section = document.getElementById("verdict");
  if (!v || v.state === "unknown") { section.hidden = true; return; }

  const word = {
    extreme: t.stateExtreme, high_wide: t.stateHighWide, high: t.stateHigh,
    notable: t.stateNotable, normal: t.stateNormal,
  }[v.state] || t.stateUnknown;
  const state = document.getElementById("verdictState");
  state.textContent = word;
  state.className = "state " + v.state;

  document.getElementById("verdictDetail").textContent = t.verdictDetail(
    v.high, v.counted, v.at_top,
    v.reach && v.reach.from, v.reach && v.reach.to);

  // The magnitude, after the extent. A percentile says where today sits
  // among past 29ths of October; a return period says how big the flood
  // is. On this river in spring they routinely disagree, and the reader
  // wants both.
  const rare = document.getElementById("verdictRarity");
  if (v.rarest && v.rarest.record_max) {
    rare.textContent = t.verdictRarity(
      Math.round(v.rarest.years), v.rarest.gauge, num(v.rarest.stage_m),
      num(v.rarest.record_max), v.rarest.record_max_year);
    rare.hidden = false;
  } else {
    rare.hidden = true;
  }

  const items = [];
  if (v.front) {
    items.push([
      t.evidenceFront(v.front.gauge, day(v.front.day), !v.front.confirmed),
      "wave.html", t.evidenceSeeWave]);
  }
  if (v.water) {
    items.push([
      t.evidenceWater(whole(v.water.km2), ratio(v.water.ratio),
                      whole(v.water.river_km || 0)),
      "index.html", t.evidenceSeeFlood]);
  }
  if (v.as_of) items.push([t.evidenceAsOf(day(v.as_of)), null, null]);

  document.getElementById("verdictEvidence").replaceChildren(
    ...items.map(([text, href, label]) => {
      const li = document.createElement("li");
      li.append(text);
      if (href) {
        const a = document.createElement("a");
        a.href = href;
        a.textContent = label;
        li.append(" ", a);
      }
      return li;
    }));
  section.hidden = false;
}

function render(data) {
  const t = T[lang];
  const gauges = data.gauges || [];
  renderVerdict(data.verdict);

  document.getElementById("lastDay").textContent = longDate(data.last_data_day);
  const fresh = document.getElementById("fresh");
  const age = data.data_age_days;
  if (age !== null && age !== undefined && age > 1) {
    fresh.textContent = t.stale(age);
    // Three days, the same threshold `crecida freshness` fails CI on. They
    // have to agree, because when the scheduled run does not happen at all
    // the CI check never runs either - and then this line is the only thing
    // in the world that notices the data has stopped moving.
    fresh.className = age > 3 ? "stale" : "";
  } else {
    fresh.textContent = "";
    fresh.className = "";
  }
  document.getElementById("thrDate").textContent = longDate(
    (data.thresholds || {}).source_date
  );
  document.getElementById("genAt").textContent = shortDateTime(data.generated_at);
  document.getElementById("meta").hidden = false;

  document.getElementById("nEvac").textContent = gauges.filter((g) => g.status === "evacuation").length;
  document.getElementById("nAlert").textContent = gauges.filter((g) => g.status === "alert").length;
  document.getElementById("nRising").textContent = gauges.filter((g) => g.change !== null && g.change > 0).length;
  document.getElementById("nOfficial").textContent = gauges.filter((g) => g.alert !== null || g.evacuation !== null).length;
  document.getElementById("tally").hidden = false;

  const list = document.getElementById("list");
  list.replaceChildren(...gauges.map(gaugeItem));
}

function fail(message) {
  const box = document.getElementById("error");
  box.textContent = message;
  box.hidden = false;
}

for (const b of document.querySelectorAll(".langs button")) {
  b.addEventListener("click", () => setLang(b.dataset.lang));
}

setLang(pickLang());

fetch("data/river_today.json", { cache: "no-cache" })
  .then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then((data) => {
    payload = data;
    render(data);
  })
  .catch((err) => fail("No se pudieron cargar los datos / could not load data: " + err.message));
</script>
</body>
</html>
