name: daily

# Fetch, test, export, publish. INA updates through the morning in
# Argentina, so this runs at 12:00 UTC (09:00 ART), after the daily report
# is usually out.
on:
  schedule:
    # Three attempts a day, at odd minutes, well spaced. GitHub runs
    # schedules on a best-effort basis and drops them under load, and the
    # top of the hour is the most contended minute there is -- a
    # "0 12 * * *" set here was dropped on its first day. Three independent
    # chances make a silent miss unlikely, and the job is idempotent: a
    # later run commits nothing if an earlier one already did the work.
    - cron: "23 12 * * *"
    - cron: "19 18 * * *"
    - cron: "11 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs publish at once, and let a newer run supersede a
# queued one - the river will have moved on.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e packages/ina-a5 -e .

      # The series cache is the raw layer: ~940k daily readings going back
      # to 1884. Restoring it means each run asks INA only for the last few
      # days. A cold cache still works, it just starts each series short.
      - name: Restore the series cache
        uses: actions/cache@v4
        with:
          path: cache
          key: series-cache-${{ github.run_id }}
          restore-keys: series-cache-

      # Thresholds move rarely and the PDF is occasionally unavailable, so a
      # failure here must not stop the river data. The committed CSV stands.
      - name: Refresh INA alert and evacuation levels
        continue-on-error: true
        run: crecida thresholds --report reports/thresholds.txt

      # ENSO moves monthly and the endpoint is a plain text file, but a
      # NOAA outage must not stop the river data. The committed series stands.
      - name: Refresh the ENSO index
        continue-on-error: true
        run: crecida oni --report reports/oni.txt

      # Rainfall needs a Google credential, which only exists here if you
      # have added a service-account key. Without the secret this step is
      # skipped and the committed series stands, going stale until someone
      # runs `crecida rainfall` locally.
      # The check is in the shell, not in `if:`. A step's own `env:` block is
      # not in scope for that step's `if:` expression -- it is evaluated
      # first -- so an `if: env.X != ''` guard here is always false and the
      # step skips even when the secret is set. That is not obvious from a
      # green run: a skipped step looks like a passing one.
      - name: Refresh the Earth Engine products
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        continue-on-error: true
        run: |
          if [ -z "$EE_SERVICE_ACCOUNT_KEY" ]; then
            echo "No EE_SERVICE_ACCOUNT_KEY secret; leaving the committed series alone."
            exit 0
          fi
          python -m pip install "earthengine-api>=1.4" "pillow>=10"
          crecida rainfall --report reports/rainfall.txt
          # The water surface the site leads with. Incremental: it adds a
          # cycle only once a Sentinel-1 repeat has passed, so on most days
          # this measures nothing and just records that it looked. Without
          # it the headline figure freezes while the gauge pages go on
          # updating, and the freshness gate below starts failing.
          crecida floodwater --report reports/floodwater.txt
          crecida flooded --report reports/flooded.txt
          # Both renders guard themselves on the cycle they last drew, so
          # they are safe to call every day: on a day with no new pass they
          # exit in a second having rendered nothing. The guard used to live
          # here and asked git whether the source table had changed, which
          # stopped working the moment the Earth Engine step started running
          # for real, because the tables rewrite their fetched_on daily.
          crecida mapframes --report reports/mapframes.txt
          crecida film --report reports/film.txt

      # fetch -> load -> data tests -> export. A failed test exits non-zero
      # here, so the commit and deploy steps below are skipped and the
      # already-published site stays exactly as it is.
      - name: Fetch, test and export
        run: crecida daily --cache-dir cache --report reports/daily.txt

      - name: Commit the published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/ina_thresholds.csv data/report_snapshot.json data/oni.json data/rainfall.json data/flooded.json data/floodwater.json data/mask_skill.json site/media reports
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "datos $(date -u +%Y-%m-%d)"
            # Someone else may have pushed while this run was fetching and
            # exporting, which takes minutes. A plain push then fails on a
            # race that costs nothing to resolve: this commit only ever
            # touches generated files, so rebasing onto whatever landed and
            # trying again is always the right answer. Without this the
            # whole deploy fails and the site is left on yesterday's data
            # because two commits arrived in the same five minutes.
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed on attempt $attempt"
                break
              fi
              echo "push rejected, rebasing and retrying"
              git pull --rebase --autostash origin main || exit 1
              sleep $((attempt * 5))
            done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Last, deliberately. The export gate lets stale data through so that
      # an INA outage keeps the site up rather than taking it down -- but
      # that leaves nobody knowing. This runs after the deploy, so the site
      # is already current with whatever it has and a stall turns the run
      # red instead of freezing the page quietly.
      # No --report: this runs after the commit step, so a file written
      # here would never be collected. The run log is the record.
      - name: Is what we published actually current?
        run: crecida freshness
