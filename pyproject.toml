[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parana-crecida"
version = "0.1.0"
description = "Flood-wave tracker for the Argentine Parana: crest detection and empirical travel time between gauges"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ammar Mahfoud" }]
dependencies = [
    "ina-a5",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "click>=8.1",
    "rich>=13",
]

[project.optional-dependencies]
# Only needed to re-derive the gauge chain from the HydroRIVERS shapefile.
geo = ["pyshp>=2.3"]
dev = ["pytest>=8", "responses>=0.25"]

[project.scripts]
crecida = "parana_crecida.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ina-a5 = { path = "packages/ina-a5", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/ina-a5/tests"]
